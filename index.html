<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F3;--sheet:#fff;--ink:#1B2A41;--muted:#5B6B7F;--line:#CBD3DC;--blue:#2F5D8A;--mark:#FFE066;--ok:#2E7D4F;--bad:#B3402F;--okbg:#E4F2E9;--badbg:#F8E5E1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{font-family:"Source Serif 4",serif;font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none}
.brand span{background:var(--mark);color:var(--ink);padding:0 6px;margin-left:2px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{color:#C9D4E3;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:.95rem}
nav.main a:hover,nav.main a.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 28px}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:.95rem;padding:9px 16px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover{background:#F4F7FA}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2A3E5C}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.skills{display:grid;border-top:2px solid var(--ink)}
.skill{display:grid;grid-template-columns:minmax(150px,1.1fr) 3fr auto;align-items:center;gap:24px;padding:24px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.skill:hover{background:var(--sheet)}
.skill b{font-family:"Source Serif 4",serif;font-size:2.1rem;line-height:1.1;background:linear-gradient(transparent 62%,var(--mark) 62%);justify-self:start}
.skill p{margin:0;color:var(--muted)}
.skill .go{font-weight:600;white-space:nowrap}
@media(max-width:720px){.skill{grid-template-columns:1fr;gap:6px}}
.test{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--blue);padding:18px 20px;margin-bottom:16px;border-radius:4px}
.test .sub{color:var(--muted);margin:0 0 12px}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.minis em{font-style:normal;color:var(--muted);font-size:.9rem;margin-right:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.empty{background:var(--sheet);border:2px dashed var(--line);padding:22px;text-align:center;color:var(--muted);border-radius:6px}
.tagk{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;background:#E3EAF2;color:var(--blue);margin-left:6px;vertical-align:middle}
.secbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin:34px 0 14px;padding-bottom:6px}
.secbar h2{margin:0}
/* generic panels */
.src,.qs,.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:10px 16px;margin-bottom:14px}
.clock{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:6px}
.clock.warn{background:var(--mark)}
.clock.urgent{background:var(--bad);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.src{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media(max-width:900px){.src{position:static;max-height:none}}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 1em}
.score{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin:6px 0 20px}
.score .big{font-family:"Source Serif 4",serif;font-size:3.6rem;font-weight:700;line-height:1;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.rv{border:1px solid var(--line);border-left-width:5px;border-radius:4px;padding:12px 16px;margin-bottom:10px;background:var(--sheet)}
.rv.ok{border-left-color:var(--ok)}
.rv.no{border-left-color:var(--bad)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:var(--badbg);color:var(--bad)}
.exp{background:#F4F7FA;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.optlist{margin:6px 0;padding-left:0;list-style:none;font-size:.95rem}
.muted{color:var(--muted)}
.wc{font-weight:600}.wc.low{color:var(--bad)}.wc.ok{color:var(--ok)}
.essay{width:100%;min-height:55vh;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.promptbox{white-space:pre-wrap;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem}
.cue{white-space:pre-wrap;font-family:"Source Serif 4",serif;font-size:1.2rem;border:2px solid var(--ink);padding:18px 22px;border-radius:4px;background:#fffbe6}
input[type=text],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.form label{display:block;font-weight:600;margin:14px 0 5px;font-size:.92rem}
.form label.inl{display:flex;gap:8px;align-items:center;font-weight:500}
.form label.inl input{width:auto}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.epart{border:1.5px solid var(--ink);border-radius:8px;padding:16px;margin:16px 0;background:var(--sheet)}
.egrp{border:1.5px dashed var(--blue);border-radius:8px;padding:14px;margin:16px 0;background:#F7FAFD}
.eq{border:1px solid var(--line);border-radius:6px;padding:12px;margin:12px 0;background:#fff}
.eqh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.eqh select{width:auto}
.eq textarea,.eq input,.eq select{margin-bottom:6px}
.chk{display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-weight:500}
.chk input{width:auto;margin:0}
table.t{width:100%;border-collapse:collapse;background:var(--sheet)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:.95rem}
table.t th{background:#F4F7FA}
table.t tr.click{cursor:pointer}
table.t tr.click:hover{background:#F0F4F8}
.meter{height:8px;background:var(--badbg);border-radius:4px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--ok)}
details.w{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:4px;margin-bottom:8px}
details.w summary{padding:10px 14px;cursor:pointer;font-weight:500}
details.w .wb{padding:0 14px 12px}
mark.ev{padding:0 2px;border-radius:2px;color:inherit}
mark.ev-no{background:#FFD6CF;border-bottom:2px solid var(--bad)}
mark.ev-ok{background:#CDEBD8;border-bottom:2px solid var(--ok)}
mark.ev sup{font-size:.7em;font-weight:700;margin-right:2px}
mark.pulse{animation:flash .6s 3}
@keyframes flash{50%{background:var(--mark)}}
.evtext{max-height:60vh;overflow:auto}
.evbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.evlegend{font-size:.88rem;color:var(--muted);margin:6px 0 10px}
.evbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.rvsplit{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.rvsplit{grid-template-columns:1fr}}
.rvsplit .src{top:12px;max-height:calc(100vh - 24px)}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
audio{width:100%;margin:6px 0}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}#toast{transition:none}}
.err{color:var(--bad);font-weight:600}
.pdf{width:100%;height:70vh;border:1px solid var(--line)}
/* ===== exam mode ===== */
body.exam{background:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body.exam .top{display:none}
body.exam main{max-width:none;padding:0}
.xhead{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;z-index:30}
.xlogo{font-weight:900;font-size:1.35rem;color:#fff;background:#C8102E;padding:2px 10px;letter-spacing:1px}
.xwho{color:#555;font-size:.9rem;margin-left:12px}
.xtimer{font-size:1.05rem;font-weight:700;text-align:center}
.xtimer .clock{font-size:1.4rem;padding:0 10px;display:inline-block}
.xsub{position:fixed;top:56px;left:0;right:0;height:42px;background:#E9ECEF;border-bottom:1px solid #bbb;padding:0 18px;display:flex;align-items:center;gap:10px;z-index:29;font-size:.95rem;overflow:hidden;white-space:nowrap}
.xbody{position:fixed;top:98px;bottom:58px;left:0;right:0;display:grid;grid-template-columns:1fr 1fr}
.xpane{overflow:auto;padding:18px 28px}
.xpane.l{border-right:4px solid #D5D9DE}
@media(max-width:900px){.xbody{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.xpane.l{border-right:0;border-bottom:4px solid #D5D9DE}.xpane{padding:12px 14px}.xwho{display:none}}
.xfoot{position:fixed;bottom:0;left:0;right:0;height:58px;background:#F3F4F6;border-top:1px solid #bbb;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;z-index:30}
.fpart{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid transparent;background:none;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;border-radius:4px}
.fpart.on{border-color:#999;background:#fff;cursor:default}
.fpart:not(.on):hover{background:#E4E7EB}
.nb{min-width:30px;height:30px;padding:0 6px;border:1px solid #888;background:#fff;font:inherit;font-size:.85rem;cursor:pointer;border-radius:3px}
.nb.done{background:#1B2A41;color:#fff;border-color:#1B2A41}
.xpane .passage{font-family:Arial,Helvetica,sans-serif;font-size:1rem;line-height:1.65}
.xpane h2{font-family:Arial,Helvetica,sans-serif;font-size:1.25rem}
.para{display:flex;gap:10px;align-items:flex-start;margin-bottom:1em}
.para p{margin:0;flex:1}
.pl{display:inline-grid;place-items:center;min-width:24px;height:24px;background:#E9ECEF;border:1px solid #bbb;font-size:.85rem}
.ghead{margin:6px 0 10px}
.ghead .ginstr{background:#F3F4F6;border:1px solid #ccc;padding:8px 12px;margin-top:6px;font-size:.95rem}
.optbox{border:1px solid #bbb;padding:8px 14px;margin:8px 0 14px;background:#fff;font-size:.95rem}
.optbox ul{margin:6px 0 0;padding:0;list-style:none}
.optbox li{padding:1px 0}
.xq{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted #ccc}
.xqn{min-width:34px;height:26px;padding:0 6px;display:grid;place-items:center;border:1.5px solid #1B2A41;font-weight:700;font-size:.85rem;border-radius:3px;background:#fff}
.xqb{flex:1}
.xqb p.qt{margin:0 0 6px}
.xqb .opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;cursor:pointer}
.xqb .opt input{margin-top:4px;width:auto}
.xqb select{width:auto;min-width:80px;padding:5px 8px}
.xqb input[type=text].blank{display:inline-block;width:150px;padding:3px 8px;margin:0 4px}
.mapimg{max-width:100%;border:1px solid #bbb;margin:6px 0}
mark.hl{background:var(--mark);color:inherit;padding:0 1px;cursor:pointer}
mark.hn{background:#BFE3FF;border-bottom:2px solid #2F7FC1}
#hlmenu{position:fixed;z-index:90;background:#1B2A41;color:#fff;border-radius:8px;padding:6px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:300px;flex-wrap:wrap}
#hlmenu[hidden]{display:none}
#hlmenu button{font:inherit;font-size:.85rem;font-weight:600;border:0;border-radius:5px;padding:5px 10px;background:#fff;color:#1B2A41;cursor:pointer}
#hlmenu .mn{font-size:.85rem;max-width:280px;padding:2px 6px}
.notes{position:fixed;right:12px;top:108px;width:320px;max-height:calc(100vh - 190px);overflow:auto;background:#fff;border:1.5px solid #1B2A41;border-radius:8px;padding:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.notes[hidden]{display:none}
.notes textarea{min-height:140px}
.notes li{font-size:.88rem;margin-bottom:6px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">IELTS<span>Studio</span></a>
  <nav class="main">
    <a href="#/" data-k="home">Trang chủ</a>
    <a href="#/manage" data-k="manage">Quản lý đề</a>
    <a href="#/history" data-k="history">Lịch sử</a>
    <a href="#/backup" data-k="backup">Sao lưu</a>
  </nav>
</header>
<main id="app"></main>
<div id="hlmenu" hidden onmousedown="event.preventDefault()"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fdate=d=>new Date(d).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const wcount=t=>t.trim()?t.trim().split(/\s+/).length:0;
function app(h){$('#app').innerHTML=h;window.scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
let cleanups=[];
const onLeave=f=>cleanups.push(f);
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Đã sao chép. Dán vào chat IELTS với Claude để được chấm.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Đã sao chép.')}
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ file storage (IndexedDB) ============ */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('ielts_studio_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(k,b)=>{const d=await idb;return new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})};
const fget=async k=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fdel=async k=>{if(!k)return;const d=await idb;return new Promise(res=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').delete(k);tx.oncomplete=res;tx.onerror=res})};
const fkeys=async()=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
async function blobUrl(k){const b=await fget(k);if(!b)return null;const u=URL.createObjectURL(b);onLeave(()=>URL.revokeObjectURL(u));return u}

/* ============ question types ============ */
const ROMAN=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi'];
const NUMW=['','ONE','TWO','THREE','FOUR'];
const QT={
 mcq:{n:'Multiple Choice (1 đáp án)',kind:'choice'},
 mcq_multi:{n:'Multiple Choice (chọn nhiều đáp án)',kind:'multi'},
 pick_list:{n:'Pick from a List (chọn từ danh sách)',kind:'multi'},
 tfng:{n:'True / False / Not Given',kind:'fixed',opts:['TRUE','FALSE','NOT GIVEN']},
 ynng:{n:'Yes / No / Not Given',kind:'fixed',opts:['YES','NO','NOT GIVEN']},
 match_headings:{n:'Matching Headings',kind:'match',list:'List of Headings',roman:true},
 match_info:{n:'Matching Information',kind:'match',list:'Paragraphs'},
 match_features:{n:'Matching Features',kind:'match',list:'List of options'},
 match_endings:{n:'Matching Sentence Endings',kind:'match',list:'Sentence endings'},
 matching:{n:'Matching',kind:'match',list:'Options'},
 summary_bank:{n:'Summary Completion (chọn từ khung)',kind:'match',list:'Word bank'},
 map_label:{n:'Plan / Map Labelling',kind:'match',list:'Locations',img:true},
 sentence_comp:{n:'Sentence Completion',kind:'fill',noun:'sentences'},
 summary_comp:{n:'Summary Completion',kind:'fill',noun:'summary'},
 note_comp:{n:'Note Completion',kind:'fill',noun:'notes'},
 table_comp:{n:'Table Completion',kind:'fill',noun:'table'},
 flow_comp:{n:'Flow-chart Completion',kind:'fill',noun:'flow-chart'},
 diagram_comp:{n:'Diagram Completion / Labelling',kind:'fill',noun:'diagram',img:true},
 form_comp:{n:'Form Completion',kind:'fill',noun:'form'},
 short_answer:{n:'Short-Answer Questions',kind:'fill',noun:'questions'}
};
const TYPES={
 reading:['mcq','mcq_multi','tfng','ynng','match_headings','match_info','match_features','match_endings','sentence_comp','summary_comp','summary_bank','note_comp','table_comp','flow_comp','diagram_comp','short_answer'],
 listening:['mcq','mcq_multi','pick_list','sentence_comp','short_answer','form_comp','note_comp','table_comp','flow_comp','summary_comp','matching','map_label','diagram_comp']
};
const W1KIND={line:'Line graph',bar:'Bar chart',pie:'Pie chart',table:'Table',process:'Process / Flowchart',map:'Map',mixed:'Mixed charts'};
const W2KIND={opinion:'Opinion (Agree / Disagree)',discussion:'Discussion (both views + opinion)',adv_dis:'Advantages & Disadvantages',causes:'Causes / Effects and Solutions',two_part:'Two-part Question'};
const SKIND={
 1:{hometown:'Hometown',accommodation:'Accommodation',work_study:'Work / Study',hobbies:'Hobbies',food:'Food',weather:'Weather',travel:'Travel',technology:'Technology',other:'Khác'},
 2:{person:'Describe a person',place:'Describe a place',event:'Describe an event / experience',object:'Describe an object',activity:'Describe an activity / habit'},
 3:{evaluating:'Evaluating / Giving opinions',comparing:'Comparing and Contrasting',predicting:'Predicting the future',adv_dis:'Advantages & Disadvantages',solutions:'Suggesting solutions'}
};
const kindName=(sk)=>sk.task!==undefined?(sk.task===1?W1KIND:W2KIND)[sk.kind]||'':(SKIND[sk.part]||{})[sk.kind]||'';
const tagk=t=>t?`<span class="tagk">${esc(t)}</span>`:'';
const labelOf=(g,i)=>QT[g.type].roman?(ROMAN[i]||String(i+1)):String.fromCharCode(65+i);
const gCount=g=>(g.options&&g.options.filter(x=>x.trim()).length)||g.count||5;
const gLabels=g=>{const a=[];for(let i=0;i<gCount(g);i++)a.push(labelOf(g,i));return a};
const qMarks=(q,g)=>QT[g.type].kind==='multi'?Math.max(1,String(q.answer||'').split(',').filter(Boolean).length):1;
const normAns=s=>String(s).toLowerCase().replace(/[£$,]/g,'').replace(/\.$/,'').replace(/\s+/g,' ').trim();
function score(q,g,a){
  const k=QT[g.type].kind;
  if(k==='multi'){const c=String(q.answer).toUpperCase().split(',').map(s=>s.trim()).filter(Boolean),s=Array.isArray(a)?a:[];if(s.length>c.length)return 0;return s.filter(x=>c.includes(x)).length}
  if(a==null||a==='')return 0;
  if(k==='fill'){if(g.maxWords&&wcount(String(a))>g.maxWords)return 0;return String(q.answer).split('|').some(x=>normAns(x)===normAns(a))?1:0}
  return String(a).toLowerCase()===String(q.answer).toLowerCase()?1:0;
}
function instr(g,skill){
  if(g.title)return g.title;
  const T=QT[g.type],src=skill==='reading'?'the passage':'the recording',lim=g.maxWords?`NO MORE THAN ${NUMW[g.maxWords]} WORD${g.maxWords>1?'S':''} AND/OR A NUMBER`:'the correct answer';
  if(g.type==='mcq')return 'Choose the correct letter, A, B, C or D.';
  if(T.kind==='multi'){const n=g.questions[0]?qMarks(g.questions[0],g):2;return `Choose ${NUMW[n]||n} letters.`}
  if(g.type==='tfng')return 'Do the following statements agree with the information given in the passage? Write TRUE if the statement agrees with the information, FALSE if it contradicts the information, NOT GIVEN if there is no information on this.';
  if(g.type==='ynng')return "Do the following statements agree with the views of the writer? Write YES if the statement agrees with the views of the writer, NO if it contradicts the views of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this.";
  if(g.type==='match_headings')return 'Choose the correct heading for each paragraph from the list of headings below.';
  if(g.type==='match_info')return 'Which paragraph contains the following information? Write the correct letter.';
  if(g.type==='match_features')return 'Match each statement with the correct option. Write the correct letter.';
  if(g.type==='match_endings')return 'Complete each sentence with the correct ending. Write the correct letter.';
  if(g.type==='matching')return 'Match each item with the correct option. Write the correct letter.';
  if(g.type==='summary_bank')return 'Complete the summary using the list of words below. Write the correct letter.';
  if(g.type==='map_label')return 'Label the map. Write the correct letter.';
  return `Complete the ${T.noun}. Write ${lim} from ${src} for each answer.`;
}

const newGroup=type=>({type,title:'',maxWords:0,options:[],count:0,imgKey:null,imgName:'',questions:[]});
const newQ=()=>({q:'',options:['','','',''],answer:'',explain:'',evidence:'',time:''});
const newG=skill=>{const g=newGroup(skill==='reading'?'tfng':'mcq');g.questions=[newQ()];return g};

function migrate(d){
  (d.tests||[]).forEach(t=>t.parts.forEach(p=>{
    if(!p.groups){
      const gs=[];
      (p.questions||[]).forEach(q=>{
        const ty=q.type==='fill'?'sentence_comp':(q.type||'mcq');
        let g=gs[gs.length-1];
        if(!g||g.type!==ty){g=newGroup(ty);gs.push(g)}
        g.questions.push({q:q.q||'',options:q.options||[],answer:String(q.answer||''),explain:q.explain||''});
      });
      p.groups=gs;delete p.questions;
    }
    if(p.labelParas===undefined)p.labelParas=false;
  }));
  ['writing','speaking','attempts','essays','recs'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.drafts)d.drafts={};
  return d;
}

function setMulti(k,L,on,max,cb){
  const a=Array.isArray(R.ans[k])?R.ans[k].slice():[];
  if(on){if(a.length>=max){cb.checked=false;toast('Chỉ chọn tối đa '+max+' đáp án.');return}a.push(L)}
  else{const i=a.indexOf(L);if(i>=0)a.splice(i,1)}
  R.ans[k]=a.sort();renderFoot();
}
function renderFoot(){
  const el=$('#xfoot');if(!el)return;
  el.innerHTML=R.idxs.map(pi=>{
    const qs=R.list[pi],done=qs.filter(isAns).length;
    if(pi===R.cur)return `<div class="fpart on"><b>Part ${pi+1}</b>${qs.map(x=>`<button class="nb ${isAns(x)?'done':''}" onclick="jumpQ('${x.k}')" aria-label="Câu ${rangeLbl(x.num)}">${rangeLbl(x.num)}</button>`).join('')}</div>`;
    return `<button class="fpart" onclick="goPart(${pi})"><b>Part ${pi+1}</b> ${done} / ${qs.length}</button>`;
  }).join('');
}
function paraHTML(pi,text,label){
  return String(text||'').split(/\n\s*\n/).filter(x=>x.trim()).map((p,i)=>{
    const key=`p-${pi}-${i}`;
    return `<div class="para">${label?`<span class="pl">${String.fromCharCode(65+i)}</span>`:''}<p class="hl-area" data-hk="${key}">${R.hl[key]||esc(p.trim())}</p></div>`;
  }).join('');
}
function fillHTML(k,q,v,num){
  const parts=String(q.q).split(/_{2,}/);
  const inp=`<input type="text" class="blank" value="${esc(v)}" autocomplete="off" spellcheck="false" aria-label="Đáp án câu ${rangeLbl(num)}" placeholder="${num.from}" oninput="setAns('${k}',this.value)">`;
  if(parts.length>1)return `<p class="qt">${parts.map(esc).join(inp)}</p>`;
  return `<p class="qt">${esc(q.q)}</p>${inp}`;
}
function qHTML(x){
  const {k,g,q,num}=x,T=QT[g.type],v=R.ans[k]==null?'':R.ans[k];
  let body='';
  const qt=`<p class="qt hl-area" data-hk="q-${k}">${R.hl['q-'+k]||esc(q.q)}</p>`;
  if(T.kind==='choice')body=qt+(q.options||[]).map((o,oi)=>{const L=String.fromCharCode(65+oi);return `<label class="opt"><input type="radio" name="r${k}" ${v===L?'checked':''} onchange="setAns('${k}','${L}')"><span>${L}. ${esc(o)}</span></label>`}).join('');
  else if(T.kind==='multi'){const max=x.m,sel=Array.isArray(v)?v:[];body=qt+(q.options||[]).map((o,oi)=>{const L=String.fromCharCode(65+oi);return `<label class="opt"><input type="checkbox" ${sel.includes(L)?'checked':''} onchange="setMulti('${k}','${L}',this.checked,${max},this)"><span>${L}. ${esc(o)}</span></label>`}).join('')}
  else if(T.kind==='fixed')body=qt+`<select aria-label="Câu ${rangeLbl(num)}" onchange="setAns('${k}',this.value)"><option value="">Chọn</option>${T.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(T.kind==='match')body=qt+`<select aria-label="Câu ${rangeLbl(num)}" onchange="setAns('${k}',this.value)"><option value="">Chọn</option>${gLabels(g).map(L=>`<option ${v===L?'selected':''}>${L}</option>`).join('')}</select>`;
  else body=fillHTML(k,q,v,num);
  return `<div class="xq" id="q_${k}"><div class="xqn">${rangeLbl(num)}</div><div class="xqb">${body}</div></div>`;
}
function gHeadHTML(pi,gi,g){
  const T=QT[g.type],qs=R.list[pi].filter(x=>x.gi===gi),f=qs[0].num.from,l=qs[qs.length-1].num.to;
  let h=`<div class="ghead"><b>${l>f?`Questions ${f}–${l}`:`Question ${f}`}</b><div class="ginstr">${esc(instr(g,R.t.skill))}</div></div>`;
  if(T.kind==='match'){
    const labs=gLabels(g);
    if(g.type==='map_label'||(T.img&&g.imgKey))h+=`<img class="mapimg" data-img="${g.imgKey||''}" alt="Hình minh hoạ">`;
    if(g.options&&g.options.some(x=>x.trim()))h+=`<div class="optbox"><b>${T.list}</b><ul>${labs.map((L,i)=>`<li><b>${L}</b>&nbsp; ${esc(g.options[i]||'')}</li>`).join('')}</ul></div>`;
    else if(g.type!=='map_label')h+=`<div class="optbox"><b>${T.list}:</b> ${labs.join(', ')}</div>`;
  }else if(T.kind==='fill'&&g.imgKey)h+=`<img class="mapimg" data-img="${g.imgKey}" alt="Hình minh hoạ">`;
  return h;
}
function renderRun(){
  const {t,idxs,cur}=R,part=t.parts[cur],rd=t.skill==='reading';

  }else{
    left=`<h2>${esc(part.title)}</h2>${part.audioKey?`<audio id="aud" controls preload="auto"></audio><p class="muted">Trong bài thi thật bạn chỉ được nghe một lần.</p>`:''}
    ${part.tts?`<p class="muted">Đề mẫu dùng giọng đọc của trình duyệt.</p><div class="row"><button class="btn primary" onclick="ttsPlay(${cur})">Phát bài nghe</button><button class="btn" onclick="ttsStop()">Dừng</button></div>`:''}
    ${!part.audioKey&&!part.tts?'<p class="muted">Part này chưa có file audio.</p>':''}`;
  }
  const right=part.groups.map((g,gi)=>g.questions.length?gHeadHTML(cur,gi,g)+R.list[cur].filter(x=>x.gi===gi).map(qHTML).join(''):'').join('')||'<p class="muted">Part này chưa có câu hỏi.</p>';
  app(`<div class="xhead"><div><span class="xlogo">IELTS</span><span class="xwho">${esc(t.title)}</span></div>
  <div class="xtimer">Thời gian còn lại <span class="clock" id="clock">${fmt(R.left)}</span></div>
  <div class="row"><button class="btn small" onclick="toggleNotes()">Ghi chú</button><button class="btn small primary" onclick="finishTest()">Nộp bài</button></div></div>
  <div class="xsub"><b>Part ${cur+1}</b> ${rd?'Read the text and answer':'Listen and answer'} ${qs.length?`questions ${f}${l>f?'–'+l:''}.`:'the questions.'} <span class="muted">Bôi đen chữ để highlight hoặc ghi chú.</span></div>
  <div class="xbody"><section class="xpane l">${left}</section><section class="xpane r">${right}</section></div>
  <div class="xfoot" id="xfoot"></div>
  <aside id="notes" class="notes" ${R.notesOpen?'':'hidden'}><b>Ghi chú của bạn</b><textarea placeholder="Viết nháp ở đây" oninput="R.notes=this.value">${esc(R.notes)}</textarea><div id="noteList"></div></aside>`);
  updateClock();renderFoot();
  if(R.notesOpen)fillNoteList();
  if(part.pdfKey)blobUrl(part.pdfKey).then(u=>{if(u&&$('#pdfv')){$('#pdfv').src=u;$('#pdfopen').href=u}});
  if(part.audioKey)blobUrl(part.audioKey).then(u=>{if(u&&$('#aud'))$('#aud').src=u});
  document.querySelectorAll('img[data-img]').forEach(im=>{const k=im.dataset.img;if(k)blobUrl(k).then(u=>{if(u)im.src=u})});

function ttsPlay(pi){
  try{
    speechSynthesis.cancel();
    const txt=R.t.parts[pi].tts;
    (txt.match(/[^.!?]+[.!?]*/g)||[txt]).forEach(s=>{if(!s.trim())return;const u=new SpeechSynthesisUtterance(s.trim());u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)});
  }catch(e){toast('Trình duyệt không hỗ trợ giọng đọc.')}
}
function ttsStop(){try{speechSynthesis.cancel()}catch(e){}}

/* ---- highlight and notes ---- */
function saveHL(){document.querySelectorAll('.hl-area').forEach(el=>{const k=el.dataset.hk;if(el.innerHTML.includes('<mark'))R.hl[k]=el.innerHTML;else delete R.hl[k]})}
const areaOf=n=>{const e=n&&n.nodeType===3?n.parentElement:n;return e&&e.closest?e.closest('.hl-area'):null};
function hideMenu(){const m=$('#hlmenu');m.hidden=true;HM=null}
function showMenu(rect,html){
  const m=$('#hlmenu');m.innerHTML=html;m.hidden=false;
  const top=rect.top-48>8?rect.top-48:rect.bottom+8;
  m.style.top=top+'px';m.style.left=Math.max(8,Math.min(rect.left,innerWidth-300))+'px';
}
function selHandler(e){
  if(!R||!R.started||R.done)return;
  const menu=$('#hlmenu');if(menu.contains(e.target))return;
  const target=e.target;
  setTimeout(()=>{
    const sel=getSelection();
    if(sel&&!sel.isCollapsed&&sel.rangeCount){
      const r=sel.getRangeAt(0),a=areaOf(r.startContainer),b=areaOf(r.endContainer);
      if(a&&a===b){HM={range:r.cloneRange(),mark:null};showMenu(r.getBoundingClientRect(),'<button onclick="hlApply(false)">Highlight</button><button onclick="hlApply(true)">Ghi chú</button>');return}
    }
    const mk=target.closest&&target.closest('mark.hl');
    if(mk){HM={range:null,mark:mk};showMenu(mk.getBoundingClientRect(),`${mk.dataset.note?`<span class="mn">${esc(mk.dataset.note)}</span>`:''}<button onclick="hlEdit()">${mk.dataset.note?'Sửa ghi chú':'Thêm ghi chú'}</button><button onclick="hlRemove()">Xoá highlight</button>`);return}
    hideMenu();
  },10);
}
function hlApply(withNote){
  if(!HM||!HM.range)return;
  let note='';
  if(withNote){const t=prompt('Nhập ghi chú:');if(t===null){hideMenu();return}note=t.trim()}
  const mk=document.createElement('mark');mk.className='hl'+(note?' hn':'');
  if(note){mk.dataset.note=note;mk.title=note}
  const r=HM.range;
  try{r.surroundContents(mk)}catch(e){mk.appendChild(r.extractContents());r.insertNode(mk)}
  getSelection().removeAllRanges();hideMenu();saveHL();
}
function hlRemove(){
  if(!HM||!HM.mark)return;
  const mk=HM.mark,p=mk.parentNode;
  while(mk.firstChild)p.insertBefore(mk.firstChild,mk);
  p.removeChild(mk);p.normalize();hideMenu();saveHL();
}
function hlEdit(){
  if(!HM||!HM.mark)return;
  const mk=HM.mark,t=prompt('Ghi chú:',mk.dataset.note||'');
  if(t===null){hideMenu();return}
  if(t.trim()){mk.dataset.note=t.trim();mk.title=t.trim();mk.classList.add('hn')}else{delete mk.dataset.note;mk.removeAttribute('title');mk.classList.remove('hn')}
  hideMenu();saveHL();
}
function toggleNotes(){R.notesOpen=!R.notesOpen;$('#notes').hidden=!R.notesOpen;if(R.notesOpen)fillNoteList()}
function fillNoteList(){
  saveHL();const tmp=document.createElement('div'),out=[];
  Object.keys(R.hl).forEach(k=>{tmp.innerHTML=R.hl[k];tmp.querySelectorAll('mark.hn').forEach(m=>out.push(`<li><b>${esc(m.textContent.slice(0,60))}</b>: ${esc(m.dataset.note)}</li>`))});
  $('#noteList').innerHTML=out.length?'<p class="muted" style="margin:10px 0 4px">Ghi chú gắn với đoạn đã highlight</p><ul style="padding-left:18px;margin:0">'+out.join('')+'</ul>':'';
}

/* ---- finish and review ---- */
function ansText(g,q,a){
  const T=QT[g.type];
  if(a==null||a===''||(Array.isArray(a)&&!a.length))return '';
  if(T.kind==='multi')return a.map(L=>L+'. '+(q.options[L.charCodeAt(0)-65]||'')).join('; ');
  if(T.kind==='choice')return a+'. '+(q.options[String(a).charCodeAt(0)-65]||'');
  if(T.kind==='match'){const i=gLabels(g).indexOf(a);return a+(g.options&&g.options[i]?'. '+g.options[i]:'')}
  return String(a);
}
function rightText(g,q){
  const T=QT[g.type];
  if(T.kind==='fill')return String(q.answer).split('|').join(' / ');
  if(T.kind==='multi')return String(q.answer).split(',').map(s=>s.trim()).map(L=>L+'. '+(q.options[L.charCodeAt(0)-65]||'')).join('; ');
  return ansText(g,q,q.answer);
}
function optsText(g,q){
  const T=QT[g.type];
  if(T.kind==='choice'||T.kind==='multi')return (q.options||[]).map((o,i)=>String.fromCharCode(65+i)+'. '+o);
  if(T.kind==='match'&&g.options&&g.options.some(x=>x.trim()))return gLabels(g).map((L,i)=>L+'. '+(g.options[i]||''));
  return [];
}
function itemHTML(it,meta,extra){
  const ok=it.got>=it.m,part=it.got>0&&!ok;
  return `<div class="${meta?'':'rv '+(ok?'ok':'no')}">${meta?'':`<span class="tag ${ok?'ok':'no'}">${ok?'Đúng':part?'Đúng một phần':'Sai'}</span> `}<b>Câu ${esc(it.no)}</b>${tagk(QT[it.type]?QT[it.type].n:it.type)}
  ${meta?`<p class="muted" style="margin:6px 0">Đề: ${esc(it.title)}${it.part&&it.part!==it.title?', '+esc(it.part):''}</p>`:''}
  <p style="margin:6px 0">${esc(qText(it))}</p>
  ${it.opts&&it.opts.length?`<ul class="optlist">${it.opts.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
  <div>Bạn trả lời: <b>${it.you?esc(it.you):'(bỏ trống)'}</b>${ok?'':`<br>Đáp án đúng: <b>${esc(it.right)}</b>`}</div>
  ${it.explain?`<div class="exp"><b>Giải thích:</b> ${esc(it.explain)}</div>`:''}${extra||''}</div>`;
}
function typeStats(items){
  const m={};items.forEach(it=>{const o=m[it.type]||(m[it.type]={n:0,e:0,t:0});o.n++;o.e+=it.got;o.t+=it.m});
  return m;
}
function finishTest(auto){
  if(!R||R.done)return;
  const un=R.totalQ-R.idxs.reduce((s,pi)=>s+R.list[pi].filter(isAns).length,0);
  if(!auto&&!confirm(un>0?`Còn ${un} câu chưa trả lời. Nộp bài?`:'Nộp bài ngay?'))return;

  let earned=0,total=0;const items=[];
  R.idxs.forEach(pi=>R.list[pi].forEach(x=>{
    const a=R.ans[x.k],got=score(x.q,x.g,a);earned+=got;total+=x.m;
    items.push({tid:R.t.id,scope:R.scope,title:R.t.title,part:R.t.parts[pi].title||'Part '+(pi+1),skill:R.t.skill,no:rangeLbl(x.num),pi,gi:x.gi,qi:x.qi,type:x.g.type,q:x.q.q,opts:optsText(x.g,x.q),you:ansText(x.g,x.q,a),right:rightText(x.g,x.q),explain:x.q.explain||'',m:x.m,got});
  }));
  const band=bandOf(R.t.skill,earned,total),used=R.total-R.left;
  DB.attempts.push({id:uid(),testId:R.t.id,title:R.t.title,skill:R.t.skill,scope:R.scope==='all'?'all':'part',scopeVal:R.scope,partName:R.scope==='all'?'':R.t.parts[R.idxs[0]].title,date:Date.now(),correct:earned,total,band,secs:used,items});
  save();
  const ts=typeStats(items);
  items.forEach((it,n)=>{it._i=n});RV={t:R.t,items,cur:R.idxs[0],idxs:R.idxs};
  app(`<h1>Kết quả</h1><div class="score"><span class="big">${earned}/${total}</span>
  <span>Band ước tính: <b>${band}</b><br><span class="muted">${total===40?'Theo bảng quy đổi 40 câu':'Quy đổi theo tỉ lệ về thang 40 câu'}</span></span>
  <span>Thời gian dùng: <b>${fmt(used)}</b></span></div>
  <div class="row" style="margin-bottom:18px"><a class="btn primary" href="#/run/${R.t.id}/${R.scope}" onclick="setTimeout(route,0)">Làm lại</a><a class="btn" href="#/list/${R.t.skill}">Danh sách đề</a><a class="btn" href="#/history">Xem lịch sử</a></div>
  <h2>Kết quả theo dạng bài</h2><div style="overflow:auto"><table class="t"><tr><th>Dạng bài</th><th>Điểm</th><th>Tỷ lệ đúng</th></tr>${Object.keys(ts).map(k=>`<tr><td>${esc(QT[k]?QT[k].n:k)}</td><td>${ts[k].e}/${ts[k].t}</td><td>${Math.round(ts[k].e/ts[k].t*100)}%</td></tr>`).join('')}</table></div>
  <h2 style="margin-top:26px">Đối chiếu với ${R.t.skill==='reading'?'bài đọc':'transcript'}</h2>
  <p class="muted">Bấm "Xem vị trí" ở mỗi câu để bài ${R.t.skill==='reading'?'đọc':'nghe'} cuộn tới đúng chỗ chứa đáp án.</p>
  <div class="rvsplit"><section class="src" id="evpanel"></section><section>${items.map(it=>itemHTML(it,false,evBtns(it._i,'r'))).join('')}</section></div>`);
  renderEvPanel();
}


/* ============ evidence: show where the answer is ============ */
let RV=null;
const qText=it=>(it.q&&typeof it.q==='object')?it.q.q:it.q;
const normT=s=>String(s).replace(/[‘’‚‛]/g,"'").replace(/[“”„]/g,'"').replace(/\s/g,' ').toLowerCase();
const trimP=s=>s.replace(/^[\s.,;:"'‘’“”]+|[\s.,;:"'‘’“”]+$/g,'');
function evFragments(q){
  if(q.evidence&&String(q.evidence).trim())return String(q.evidence).split('|').map(trimP).filter(Boolean);
  const ex=String(q.explain||''),quotes=[],re=/[“"]([^”"]{6,}?)[”"]/g;let m;
  while((m=re.exec(ex)))quotes.push(m[1]);
  const frags=quotes.flatMap(x=>x.split(/…|\.{3}/)).map(trimP).filter(x=>x.length>=6);
  const long=frags.filter(x=>x.length>=20);
  return long.length?long:frags;
}
function itemRef(test,it){
  const qt=qText(it),P=test.parts;
  if(it.pi!=null&&P[it.pi]&&P[it.pi].groups[it.gi]&&P[it.pi].groups[it.gi].questions[it.qi]){
    const g=P[it.pi].groups[it.gi];return{pi:it.pi,gi:it.gi,qi:it.qi,g,q:g.questions[it.qi]};
  }
  for(const strict of [true,false])for(let pi=0;pi<P.length;pi++){
    if(strict&&(P[pi].title||'Part '+(pi+1))!==it.part)continue;
    for(let gi=0;gi<P[pi].groups.length;gi++){const g=P[pi].groups[gi];
      for(let qi=0;qi<g.questions.length;qi++)if(g.questions[qi].q===qt)return{pi,gi,qi,g,q:g.questions[qi]};}
  }
  return null;
}
const partText=(test,part)=>test.skill==='reading'?(part.text||''):(part.tts||'');
function itemMarks(test,pi,its){
  const text=partText(test,test.parts[pi]),nt=normT(text),marks=[];
  its.forEach(it=>{
    const ref=itemRef(test,it);if(!ref||ref.pi!==pi)return;
    evFragments(ref.q).forEach(f=>{
      const nf=normT(f).replace(/ +/g,' '),i=nt.indexOf(nf);
      if(i>=0)marks.push({s:i,e:i+nf.length,cls:it.got>=it.m?'ev-ok':'ev-no',num:String(it.no).split('-')[0],id:it._i});
    });
  });
  return marks.sort((a,b)=>a.s-b.s);
}
function evPassageHTML(text,label,marks){
  const paras=[],re=/\n\s*\n/g;let last=0,m;
  while((m=re.exec(text))){paras.push([last,m.index]);last=m.index+m[0].length}
  paras.push([last,text.length]);
  return paras.filter(p=>text.slice(p[0],p[1]).trim()).map((p,i)=>{
    const a=p[0],b=p[1];let out='',pos=a;
    marks.filter(x=>x.e>a&&x.s<b).forEach(x=>{
      const s=Math.max(x.s,a),e=Math.min(x.e,b);if(s<pos)return;
      out+=esc(text.slice(pos,s))+`<mark class="ev ${x.cls}" data-ev="${x.id}"><sup>${x.num}</sup>${esc(text.slice(s,e))}</mark>`;pos=e;
    });
    out+=esc(text.slice(pos,b));
    return `<div class="para">${label?`<span class="pl">${String.fromCharCode(65+i)}</span>`:''}<p>${out}</p></div>`;
  }).join('');
}
function evPanel(test,pi,its,pid){
  const part=test.parts[pi],rd=test.skill==='reading',text=partText(test,part),marks=itemMarks(test,pi,its);
  let h=`<h3>${esc(part.title||'Part '+(pi+1))}</h3>`;
  if(!rd&&part.audioKey)h+=`<audio id="evaud_${pid}" controls></audio>`;
  h+=`<p class="evlegend"><mark class="ev ev-no">đỏ</mark> vị trí đáp án của câu bạn làm sai, <mark class="ev ev-ok">xanh</mark> vị trí đáp án của câu đúng. Số nhỏ là số câu.</p>`;
  if(!text)h+=`<p class="muted">${rd&&part.pdfKey?'Bài đọc dạng PDF nên không đánh dấu được vị trí. Hãy mở lại file PDF để đối chiếu.':'Part này chưa có '+(rd?'bài đọc':'transcript')+'.'}</p>`;
  else h+=`<div class="passage evtext">${evPassageHTML(text,rd&&part.labelParas,marks)}</div>`;
  return h;
}
function afterEv(test,pi,pid){
  const part=test.parts[pi];
  if(part.audioKey)blobUrl(part.audioKey).then(u=>{const a=document.getElementById('evaud_'+pid);if(u&&a)a.src=u});
}
function evBtns(i,pid){
  const lis=RV&&RV.t.skill==='listening';
  return `<div class="evbar"><button class="btn small" onclick="evGo(${i})">Xem vị trí trong ${lis?'transcript':'bài'}</button>${lis?`<button class="btn small" onclick="evPlay(${i})">Nghe lại đoạn này</button>`:''}</div>`;
}
function renderEvPanel(){
  const el=$('#evpanel');if(!el)return;
  const tabs=RV.idxs.length>1?`<div class="evbar">${RV.idxs.map(pi=>`<button class="btn small ${pi===RV.cur?'primary':''}" onclick="RV.cur=${pi};renderEvPanel()">${esc(RV.t.parts[pi].title||'Part '+(pi+1))}</button>`).join('')}</div>`:'';
  el.innerHTML=tabs+evPanel(RV.t,RV.cur,RV.items.filter(it=>it.pi===RV.cur),'r');
  afterEv(RV.t,RV.cur,'r');
}
function flashMark(root,i){
  const m=root.querySelector(`mark[data-ev="${i}"]`);
  if(!m)return false;
  m.scrollIntoView({block:'center',behavior:'smooth'});
  m.classList.remove('pulse');void m.offsetWidth;m.classList.add('pulse');
  return true;
}
const NOEV='Chưa xác định được vị trí của câu này. Hãy thêm "Vị trí trong bài" cho câu hỏi trong phần sửa đề.';
function evGo(i){
  const it=RV.items[i];if(RV.cur!==it.pi){RV.cur=it.pi;renderEvPanel()}
  if(!flashMark($('#evpanel'),i))toast(NOEV);
}
const parseTime=t=>{if(t==null||t==='')return null;const s=String(t).trim();if(/^\d+(\.\d+)?$/.test(s))return +s;const m=s.match(/^(\d+):(\d{1,2})$/);return m?(+m[1])*60+(+m[2]):null};
function playEv(test,it,pid){
  const ref=itemRef(test,it);if(!ref)return toast(NOEV);
  const part=test.parts[ref.pi],aud=document.getElementById('evaud_'+pid),tm=parseTime(ref.q.time);
  if(aud&&aud.src&&tm!=null){aud.currentTime=tm;aud.play();return}
  const mk=itemMarks(test,ref.pi,[it])[0],text=part.tts||'';
  if(part.audioKey&&!aud)return toast('Không tìm thấy trình phát audio.');
  if(part.audioKey&&tm==null)return toast('Câu này chưa có thời điểm trong audio. Hãy thêm "Thời điểm trong audio" (ví dụ 01:25) trong phần sửa đề.');
  if(!mk||!text)return toast(NOEV);
  let a=-1,b=text.length;
  for(const c of '.!?'){a=Math.max(a,text.lastIndexOf(c,mk.s-1));const n=text.indexOf(c,mk.e);if(n>=0)b=Math.min(b,n+1)}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(a+1,b).trim());u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)}catch(e){toast('Trình duyệt không hỗ trợ giọng đọc.')}
}
function evPlay(i){playEv(RV.t,RV.items[i],'r')}
function toggleEv(i){
  const box=document.getElementById('evb_'+i),it=WL[i];
  if(!box.hidden){box.hidden=true;box.innerHTML='';return}
  const test=DB.tests.find(x=>x.id===it.tid);
  if(!test)return toast('Đề gốc đã bị xoá nên không thể hiển thị bài.');
  const ref=itemRef(test,it);
  if(!ref)return toast('Không tìm thấy câu hỏi này trong đề hiện tại (đề có thể đã được sửa).');
  const lis=test.skill==='listening';
  box.hidden=false;
  box.innerHTML=evPanel(test,ref.pi,[it],'h'+i)+(lis?`<div class="evbar"><button class="btn small" onclick="playEv(DB.tests.find(x=>x.id==='${test.id}'),WL[${i}],'h${i}')">Nghe lại đoạn này</button></div>`:'');
  afterEv(test,ref.pi,'h'+i);
  setTimeout(()=>{if(!flashMark(box,i))toast(NOEV)},60);
}

/* ============ writing ============ */
let W=null;
function buildReq(p,text,secs,words){
  return `Please act as my IELTS teacher (band 9.0 level) and mark my IELTS Writing Task ${p.task}${kindName(p)?' ('+kindName(p)+')':''}.
Please: (1) estimate my band for each criterion (${p.task===1?'Task Achievement':'Task Response'}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy) and my overall band; (2) show my mistakes and how to fix them; (3) suggest band 8+ collocations, vocabulary and structures I can use; (4) show how I could improve my ideas, and give a short model paragraph if useful.

Question:
${p.prompt}

Time used: ${Math.round(secs/60)} minutes (limit ${p.task===1?20:40}) | Word count: ${words}

My answer:
${text}`;
}
function writeRun(id){
  const p=DB.writing.find(x=>x.id===id);
  if(!p)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const mins=p.task===1?20:40,minW=p.task===1?150:250;
  W={p,left:mins*60,total:mins*60,started:false,done:false,iv:null,minW};
  onLeave(()=>clearInterval(W&&W.iv));
  const draft=DB.drafts[id]||'';
  app(`<div class="bar"><strong>${esc(p.title)}</strong><div class="clock" id="clock">${fmt(W.left)}</div><div class="row"><button class="btn" id="wstart" onclick="writeStart()">Bắt đầu tính giờ</button><button class="btn primary" onclick="writeFinish()">Nộp bài</button></div></div>
  <div class="split"><section class="src"><div class="promptbox">${esc(p.prompt)}</div>${p.imgKey?'<p><img id="wimg" alt="Biểu đồ đề bài" style="max-width:100%"></p>':''}</section>
  <section class="panel"><textarea id="essay" class="essay" placeholder="Bấm Bắt đầu tính giờ rồi viết bài ở đây. Bài được tự lưu nháp." disabled>${esc(draft)}</textarea>
  <p class="wc" id="wc"></p></section></div>`);
  const ta=$('#essay');
  const upd=()=>{const n=wcount(ta.value),el=$('#wc');el.textContent=`${n} từ (tối thiểu ${minW})`;el.className='wc '+(n>=minW?'ok':'low');DB.drafts[id]=ta.value;if(!upd.t)upd.t=setTimeout(()=>{upd.t=0;save()},1500)};
  ta.addEventListener('input',upd);upd();
  if(p.imgKey)blobUrl(p.imgKey).then(u=>{if(u&&$('#wimg'))$('#wimg').src=u});
  if(draft)ta.disabled=false;
}
function writeStart(){
  if(W.started)return;W.started=true;
  $('#essay').disabled=false;$('#essay').focus();$('#wstart').disabled=true;
  W.iv=setInterval(()=>{W.left--;const c=$('#clock');if(c){c.textContent=fmt(W.left);c.className='clock'+(W.left<=60?' urgent':W.left<=300?' warn':'')}if(W.left<=0){clearInterval(W.iv);toast('Hết giờ. Hãy nộp bài.');$('#essay').disabled=true}},1000);
}
function writeFinish(){
  if(W.done)return;
  const text=$('#essay').value;
  if(!text.trim()){toast('Bạn chưa viết gì.');return}
  if(W.left>0&&!confirm('Nộp bài và tạo yêu cầu chấm?'))return;
  W.done=true;clearInterval(W.iv);
  const words=wcount(text),secs=W.total-Math.max(0,W.left);
  const req=buildReq(W.p,text,secs,words);
  const e={id:uid(),promptId:W.p.id,title:W.p.title,task:W.p.task,kind:W.p.kind||'',text,words,secs,date:Date.now(),req};
  DB.essays.push(e);delete DB.drafts[W.p.id];save();
  app(`<h1>Đã lưu bài viết</h1><p class="lead">${words} từ, thời gian dùng ${fmt(secs)}. Bấm sao chép rồi dán toàn bộ nội dung vào chat IELTS với Claude để được chấm band và sửa lỗi.</p>
  <div class="row" style="margin-bottom:12px"><button class="btn primary" onclick="copyEssay('${e.id}')">Sao chép bài và yêu cầu chấm</button><a class="btn" href="#/list/writing">Danh sách đề</a><a class="btn" href="#/history">Xem lịch sử</a></div>
  <textarea readonly rows="18" onclick="this.select()">${esc(req)}</textarea>`);
}
function copyEssay(id){const e=DB.essays.find(x=>x.id===id);if(e)copyText(e.req)}

/* ============ speaking ============ */
let S=null;
function speakRun(id){
  const sp=DB.speaking.find(x=>x.id===id);
  if(!sp)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const phases=sp.part===2?[{n:'Chuẩn bị',s:60,rec:false},{n:'Nói',s:120,rec:true}]:[{n:'Trả lời',s:300,rec:true}];
  S={sp,phases,pi:-1,left:0,iv:null,mr:null,stream:null,chunks:[],t0:0};
  onLeave(()=>{clearInterval(S.iv);stopRec()});
  const content=sp.part===2?`<div class="cue">${esc(sp.content)}</div>`:`<ol class="passage">${sp.content.split('\n').filter(x=>x.trim()).map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`;
  app(`<h1>${esc(sp.title)}${tagk(kindName(sp))}</h1>
  <div class="split"><section class="panel">${content}</section>
  <section class="panel"><div class="clock" id="clock" style="display:inline-block">--:--</div> <b id="phase" style="margin-left:8px">Sẵn sàng</b>
  <p class="muted">${sp.part===2?'Chuẩn bị 1 phút, sau đó nói tối đa 2 phút.':'Trả lời tự nhiên, tối đa 5 phút.'}</p>
  <label class="opt" style="display:flex;gap:8px"><input type="checkbox" id="dorec" checked style="width:auto"><span>Ghi âm bài nói</span></label>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="sbtn" onclick="speakStart()">Bắt đầu</button><button class="btn" onclick="speakStop()">Dừng</button><button class="btn" onclick="copySpeakReq()">Sao chép đề để gửi chấm</button></div>
  <h3 style="margin-top:22px">Các bản ghi âm của đề này</h3><div id="reclist"></div></section></div>`);
  renderRecs();
}
function copySpeakReq(){
  const sp=S.sp;
  copyText(`Please act as my IELTS Speaking examiner (band 9.0 level). I just practised IELTS Speaking Part ${sp.part}${kindName(sp)?' ('+kindName(sp)+')':''}. Please mark my answer on fluency and coherence, lexical resource, grammatical range and accuracy, and pronunciation, show my mistakes and better ways to say it, and give band 8+ vocabulary and ideas.\n\nQuestion(s):\n${sp.content}\n\nMy answer (paste transcript here):\n`);
}
function speakStart(){if(S.pi>=0)return;nextPhase()}
function nextPhase(){
  clearInterval(S.iv);S.pi++;
  if(S.pi>=S.phases.length){speakStop();return}
  const ph=S.phases[S.pi];S.left=ph.s;
  $('#phase').textContent=ph.n;$('#sbtn').disabled=true;
  const tick=()=>{const c=$('#clock');if(c){c.textContent=fmt(S.left);c.className='clock'+(S.left<=10?' urgent':'')}};
  tick();
  if(ph.rec&&$('#dorec').checked)startRec();
  S.iv=setInterval(()=>{S.left--;tick();if(S.left<=0){if(S.pi===S.phases.length-1)speakStop();else nextPhase()}},1000);
}
function speakStop(){
  clearInterval(S.iv);
  if(S.pi>=0&&$('#phase'))$('#phase').textContent='Đã kết thúc';
  stopRec();S.pi=-1;
  const b=$('#sbtn');if(b)b.disabled=false;
}
async function startRec(){
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    S.mr=new MediaRecorder(S.stream);S.chunks=[];S.t0=Date.now();
    S.mr.ondataavailable=e=>{if(e.data.size)S.chunks.push(e.data)};
    const sp=S.sp,chunks=S.chunks,t0=S.t0,mr=S.mr;
    mr.onstop=async()=>{
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(!blob.size)return;
      const r={id:uid(),spId:sp.id,title:sp.title,part:sp.part,kind:sp.kind||'',date:Date.now(),secs:Math.round((Date.now()-t0)/1000),mime:blob.type};
      await fput('rec_'+r.id,blob);DB.recs.push(r);save();
      if($('#reclist'))renderRecs();
      toast('Đã lưu bản ghi âm.');
    };
    S.mr.start();
    const ph=$('#phase');if(ph)ph.innerHTML='<span class="rec"></span>'+esc(S.phases[S.pi]?S.phases[S.pi].n:'Ghi âm');
  }catch(e){toast('Không bật được micro. Hãy cho phép quyền truy cập micro.')}
}
function stopRec(){
  if(S&&S.mr&&S.mr.state!=='inactive'){try{S.mr.stop()}catch(e){}}
  if(S&&S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}
}
function renderRecs(){
  const box=$('#reclist');if(!box)return;
  const rs=DB.recs.filter(r=>r.spId===S.sp.id).reverse();
  box.innerHTML=rs.length?rs.map(r=>`<div class="rv"><b>${fdate(r.date)}</b>, ${fmt(r.secs)}<audio id="a_${r.id}" controls></audio><div class="row"><button class="btn small" onclick="dlRec('${r.id}')">Tải về</button><button class="btn small danger" onclick="delRec('${r.id}')">Xoá</button></div></div>`).join(''):'<p class="muted">Chưa có bản ghi âm nào.</p>';
  rs.forEach(r=>blobUrl('rec_'+r.id).then(u=>{const a=$('#a_'+r.id);if(u&&a)a.src=u}));
}
async function dlRec(id){const r=DB.recs.find(x=>x.id===id),b=await fget('rec_'+id);if(b)download('speaking-'+fdate(r.date).replace(/[^0-9]/g,'')+'.'+(r.mime.includes('mp4')?'m4a':'webm'),b)}
async function delRec(id){if(!confirm('Xoá bản ghi âm này?'))return;await fdel('rec_'+id);DB.recs=DB.recs.filter(x=>x.id!==id);save();(S&&$('#reclist'))?renderRecs():route()}

/* ============ history ============ */
let H={skill:'all',type:'all'};
function historyPage(){
  const st=sk=>{const a=DB.attempts.filter(x=>x.skill===sk),e=a.reduce((s,x)=>s+x.correct,0),t=a.reduce((s,x)=>s+x.total,0),full=a.filter(x=>x.scope==='all').length;return{n:a.length,full,mini:a.length-full,e,t,pct:t?Math.round(e/t*100):0}};
  const sumRow=(name,s)=>`<tr><td><b>${name}</b></td><td>${s.n} lượt (${s.full} cả đề, ${s.mini} mini)</td><td>${s.t}</td><td>${s.e}</td><td>${s.t-s.e}</td><td>${s.t?`<div class="row"><b>${s.pct}% đúng</b><div class="meter" style="width:120px"><i style="width:${s.pct}%"></i></div><span class="muted">${100-s.pct}% sai</span></div>`:'<span class="muted">Chưa có dữ liệu</span>'}</td></tr>`;
  const allItems=DB.attempts.flatMap(a=>(a.items||[]).map(it=>Object.assign({},it,{skill:it.skill||a.skill,date:a.date})));
  const ts={};
  allItems.forEach(it=>{const k=it.skill+'|'+it.type;const o=ts[k]||(ts[k]={skill:it.skill,type:it.type,n:0,e:0,t:0});o.n++;o.e+=it.got;o.t+=it.m});
  const trows=Object.values(ts).sort((a,b)=>a.e/a.t-b.e/b.t);
  const w1=DB.essays.filter(e=>e.task===1).length,w2=DB.essays.filter(e=>e.task===2).length;
  const wk={};DB.essays.forEach(e=>{const n=kindName(e)||'Chưa phân loại';wk[n]=(wk[n]||0)+1});
  const sk={};DB.recs.forEach(r=>{const n='Part '+(r.part||'?')+(kindName(r)?', '+kindName(r):'');sk[n]=(sk[n]||0)+1});
  const at=DB.attempts.slice().reverse();
  app(`<h1>Lịch sử</h1>
  <h2>Tổng hợp</h2>
  <div style="overflow:auto"><table class="t"><tr><th>Kỹ năng</th><th>Số lần làm</th><th>Tổng số câu</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ</th></tr>
  ${sumRow('Reading',st('reading'))}${sumRow('Listening',st('listening'))}
  <tr><td><b>Writing</b></td><td colspan="5">${DB.essays.length} bài đã nộp (Task 1: ${w1}, Task 2: ${w2}). ${Object.keys(wk).map(k=>esc(k)+': '+wk[k]).join(', ')}</td></tr>
  <tr><td><b>Speaking</b></td><td colspan="5">${DB.recs.length} bản ghi âm. ${Object.keys(sk).map(k=>esc(k)+': '+sk[k]).join('; ')}</td></tr></table></div>
  <h2 style="margin-top:32px">Kết quả theo dạng bài</h2>
  ${trows.length?`<p class="muted">Sắp xếp từ dạng bạn làm yếu nhất. Bấm vào một dòng để xem các câu sai của dạng đó.</p><div style="overflow:auto"><table class="t"><tr><th>Kỹ năng</th><th>Dạng bài</th><th>Số câu hỏi</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ đúng</th></tr>${trows.map(r=>`<tr class="click" onclick="setHist('${r.skill}','${r.type}')"><td>${r.skill==='reading'?'Reading':'Listening'}</td><td>${esc(QT[r.type]?QT[r.type].n:r.type)}</td><td>${r.t}</td><td>${r.e}</td><td>${r.t-r.e}</td><td>${Math.round(r.e/r.t*100)}%</td></tr>`).join('')}</table></div>`:'<div class="empty">Làm vài bài Reading hoặc Listening để thấy thống kê theo dạng bài. Các bài làm trước khi có tính năng này chưa lưu chi tiết từng câu.</div>'}
  <h2 style="margin-top:32px">Các câu làm sai</h2>
  <div class="row" style="margin-bottom:12px"><select id="hs" style="width:auto" onchange="H.skill=this.value;renderWrong()"><option value="all">Mọi kỹ năng</option><option value="reading">Reading</option><option value="listening">Listening</option></select>
  <select id="ht" style="width:auto" onchange="H.type=this.value;renderWrong()"><option value="all">Mọi dạng bài</option>${Object.keys(QT).map(k=>`<option value="${k}">${esc(QT[k].n)}</option>`).join('')}</select></div>
  <div id="wrongBox"></div>
  <h2 style="margin-top:32px">Các lượt làm bài</h2>
  ${at.length?`<div style="overflow:auto"><table class="t"><tr><th>Ngày</th><th>Kỹ năng</th><th>Đề</th><th>Điểm</th><th>Band ước tính</th><th>Thời gian</th></tr>${at.map(a=>`<tr><td>${fdate(a.date)}</td><td>${a.skill==='reading'?'Reading':'Listening'}</td><td>${esc(a.title)}${a.partName?', '+esc(a.partName):', cả đề'}</td><td>${a.correct}/${a.total}</td><td>${a.band}</td><td>${fmt(a.secs)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa có bài nào.</div>'}
  <h2 style="margin-top:32px">Bài Writing đã nộp</h2>
  ${DB.essays.length?DB.essays.slice().reverse().map(e=>`<div class="rv"><b>${esc(e.title)}</b>${tagk(kindName(e))}<br><span class="muted">${fdate(e.date)}, ${e.words} từ, ${fmt(e.secs)}</span><div class="row" style="margin-top:8px"><button class="btn small primary" onclick="copyEssay('${e.id}')">Sao chép bài và yêu cầu chấm</button><button class="btn small danger" onclick="delEssay('${e.id}')">Xoá</button></div></div>`).join(''):'<div class="empty">Chưa có bài Writing nào.</div>'}
  <h2 style="margin-top:32px">Bản ghi âm Speaking</h2>
  ${DB.recs.length?DB.recs.slice().reverse().map(r=>`<div class="rv"><b>${esc(r.title)}</b>, ${fdate(r.date)}, ${fmt(r.secs)}<audio id="a_${r.id}" controls></audio><div class="row"><button class="btn small" onclick="dlRec('${r.id}')">Tải về</button><button class="btn small danger" onclick="delRec('${r.id}')">Xoá</button></div></div>`).join(''):'<div class="empty">Chưa có bản ghi âm nào.</div>'}`);
  $('#hs').value=H.skill;$('#ht').value=H.type;renderWrong();
  DB.recs.forEach(r=>blobUrl('rec_'+r.id).then(u=>{const a=$('#a_'+r.id);if(u&&a)a.src=u}));
}
function setHist(sk,ty){H.skill=sk;H.type=ty;$('#hs').value=sk;$('#ht').value=ty;renderWrong();$('#wrongBox').scrollIntoView({behavior:'smooth',block:'start'})}
let WL=[];
function renderWrong(){
  const items=DB.attempts.slice().reverse().flatMap(a=>(a.items||[]).map(it=>Object.assign({},it,{skill:it.skill||a.skill,date:a.date})))
    .filter(it=>it.got<it.m&&(H.skill==='all'||it.skill===H.skill)&&(H.type==='all'||it.type===H.type));
  items.forEach((it,n)=>{it._i=n});WL=items;
  $('#wrongBox').innerHTML=items.length?`<p class="muted">${items.length} câu sai. Bấm vào từng câu để xem đề, đáp án của bạn và giải thích.</p>`+items.map(it=>`<details class="w"><summary>${it.skill==='reading'?'Reading':'Listening'}, câu ${esc(it.no)}, ${esc(QT[it.type]?QT[it.type].n:it.type)}, ${esc(it.title)} <span class="muted">(${fdate(it.date)})</span></summary><div class="wb">${itemHTML(it,true,'<div class="evbar"><button class="btn small" onclick="toggleEv('+it._i+')">Xem vị trí trong '+(it.skill==='reading'?'bài đọc':'transcript')+'</button></div><div class="evbox" id="evb_'+it._i+'" hidden></div>')}<p style="margin-top:10px"><a class="btn small" href="#/run/${it.tid}/${it.scope}">Làm lại đề này</a></p></div></details>`).join(''):'<div class="empty">Không có câu sai nào khớp bộ lọc.</div>';
}
function delEssay(id){if(!confirm('Xoá bài viết này?'))return;DB.essays=DB.essays.filter(x=>x.id!==id);save();historyPage()}

/* ============ manage ============ */
function managePage(){
  const li=(h,edit,del)=>`<div class="rv"><div class="row sp"><span>${h}</span><span class="row"><a class="btn small" href="${edit}">Sửa</a><button class="btn small danger" onclick="${del}">Xoá</button></span></div></div>`;
  const sec=(title,addHref,addLbl,items)=>`<div class="secbar"><h2>${title}</h2><a class="btn primary small" href="${addHref}">${addLbl}</a></div>${items||'<div class="empty">Chưa có đề.</div>'}`;
  const tl=k=>DB.tests.filter(t=>t.skill===k).map(t=>li(`<b>${esc(t.title)}</b> <span class="muted">(${t.parts.length} part, ${nQuestions(t)} câu)</span>`,'#/edit/'+t.id,`delTest('${t.id}')`)).join('');
  app(`<div class="row sp"><h1>Quản lý đề</h1><button class="btn" onclick="importJsonPage()">Nhập đề từ JSON</button></div>
  <p class="lead">Tạo, sửa, xoá đề và tải lên file PDF hoặc audio. File được lưu trong trình duyệt của bạn, không đưa lên GitHub.</p>
  ${sec('Reading','#/edit/new-reading','Thêm đề Reading',tl('reading'))}
  ${sec('Listening','#/edit/new-listening','Thêm đề Listening',tl('listening'))}
  ${sec('Writing','#/editw/new','Thêm đề Writing',DB.writing.map(w=>li(`<b>${esc(w.title)}</b> <span class="muted">(Task ${w.task})</span>${tagk(kindName(w))}`,'#/editw/'+w.id,`delWriting('${w.id}')`)).join(''))}
  ${sec('Speaking','#/edits/new','Thêm đề Speaking',DB.speaking.map(s=>li(`<b>${esc(s.title)}</b> <span class="muted">(Part ${s.part})</span>${tagk(kindName(s))}`,'#/edits/'+s.id,`delSpeaking('${s.id}')`)).join(''))}`);
}
async function delTest(id){const t=DB.tests.find(x=>x.id===id);if(!confirm('Xoá đề "'+t.title+'"?'))return;for(const p of t.parts){await fdel(p.pdfKey);await fdel(p.audioKey);for(const g of p.groups)await fdel(g.imgKey)}DB.tests=DB.tests.filter(x=>x.id!==id);save();managePage()}
async function delWriting(id){const w=DB.writing.find(x=>x.id===id);if(!confirm('Xoá đề này?'))return;await fdel(w.imgKey);DB.writing=DB.writing.filter(x=>x.id!==id);save();managePage()}
function delSpeaking(id){if(!confirm('Xoá đề này?'))return;DB.speaking=DB.speaking.filter(x=>x.id!==id);save();managePage()}

/* ---- test editor ---- */
let E=null;
function editTest(id){
  if(id==='new-reading'||id==='new-listening'){const sk=id.slice(4);E={id:uid(),skill:sk,title:'',fullMinutes:60,partMinutes:sk==='reading'?20:10,parts:[newPart(sk)]}}
  else{const t=DB.tests.find(x=>x.id===id);if(!t)return app('<p class="err">Không tìm thấy đề.</p>');E=JSON.parse(JSON.stringify(t))}
  renderEditor();
}
const eSet=(k,v)=>{E[k]=v};
const pSet=(pi,k,v)=>{E.parts[pi][k]=v};
const gSet=(pi,gi,k,v)=>{E.parts[pi].groups[gi][k]=v};
const gOpts=(pi,gi,v)=>{E.parts[pi].groups[gi].options=v.split('\n')};
const qSet=(pi,gi,qi,k,v)=>{E.parts[pi].groups[gi].questions[qi][k]=v};
const qOpts=(pi,gi,qi,v)=>{E.parts[pi].groups[gi].questions[qi].options=v.split('\n')};
function qMulti(pi,gi,qi,L,on){
  const q=E.parts[pi].groups[gi].questions[qi];
  const a=String(q.answer||'').split(',').filter(Boolean);
  const i=a.indexOf(L);if(on&&i<0)a.push(L);if(!on&&i>=0)a.splice(i,1);
  q.answer=a.sort().join(',');
}
function gType(pi,gi,v){const g=E.parts[pi].groups[gi];g.type=v;g.questions.forEach(q=>{q.answer='';if(QT[v].kind==='choice'||QT[v].kind==='multi'){if(!q.options||!q.options.length)q.options=['','','','']}});renderEditor()}
function addPart(){E.parts.push(newPart(E.skill));renderEditor()}
function delPart(pi){if(E.parts.length<2)return toast('Đề cần ít nhất 1 part.');if(!confirm('Xoá part này?'))return;E.parts.splice(pi,1);renderEditor()}
function addGroup(pi){const g=newG(E.skill);E.parts[pi].groups.push(g);renderEditor()}
function delGroup(pi,gi){if(!confirm('Xoá nhóm câu hỏi này?'))return;E.parts[pi].groups.splice(gi,1);renderEditor()}
function addQ(pi,gi){E.parts[pi].groups[gi].questions.push(newQ());renderEditor()}
function delQ(pi,gi,qi){E.parts[pi].groups[gi].questions.splice(qi,1);renderEditor()}
async function upFile(pi,kind,input){
  const f=input.files[0];if(!f)return;
  const p=E.parts[pi];await fdel(p[kind+'Key']);
  const key='f_'+uid();await fput(key,f);p[kind+'Key']=key;p[kind+'Name']=f.name;toast('Đã tải lên '+f.name);renderEditor();
}
async function rmFile(pi,kind){const p=E.parts[pi];await fdel(p[kind+'Key']);p[kind+'Key']=null;p[kind+'Name']='';renderEditor()}
async function upGImg(pi,gi,input){
  const f=input.files[0];if(!f)return;const g=E.parts[pi].groups[gi];
  await fdel(g.imgKey);g.imgKey='f_'+uid();g.imgName=f.name;await fput(g.imgKey,f);renderEditor();
}
async function rmGImg(pi,gi){const g=E.parts[pi].groups[gi];await fdel(g.imgKey);g.imgKey=null;g.imgName='';renderEditor()}
function ansControl(pi,gi,qi,g,q){
  const T=QT[g.type],id=`${pi},${gi},${qi}`;
  if(T.kind==='choice')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${'ABCDEF'.split('').map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;
  if(T.kind==='multi'){const sel=String(q.answer||'').split(',');return `<div><b style="font-size:.9rem">Các đáp án đúng:</b> ${'ABCDEFG'.split('').map(L=>`<label class="chk"><input type="checkbox" ${sel.includes(L)?'checked':''} onchange="qMulti(${id},'${L}',this.checked)">${L}</label>`).join('')}</div>`}
  if(T.kind==='fixed')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${T.opts.map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;
  if(T.kind==='match')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${gLabels(g).map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;
  return `<input type="text" value="${esc(q.answer)}" placeholder="Đáp án. Nhiều đáp án chấp nhận thì cách nhau bằng dấu |, ví dụ: ten|10" oninput="qSet(${id},'answer',this.value)">`;
}
function groupEditor(pi,gi,g){
  const T=QT[g.type],rd=E.skill==='reading';
  const types=TYPES[E.skill].map(k=>`<option value="${k}" ${k===g.type?'selected':''}>${esc(QT[k].n)}</option>`).join('');
  let extra='';
  if(T.kind==='fill')extra+=`<label>Giới hạn số từ cho mỗi đáp án</label><select onchange="gSet(${pi},${gi},'maxWords',+this.value)"><option value="0" ${!g.maxWords?'selected':''}>Không giới hạn</option>${[1,2,3].map(n=>`<option value="${n}" ${g.maxWords===n?'selected':''}>Tối đa ${n} từ và/hoặc 1 số</option>`).join('')}</select>`;
  if(T.kind==='match'){
    extra+=`<label>${T.list} (mỗi dòng một lựa chọn, tự gán nhãn ${T.roman?'i, ii, iii':'A, B, C'})</label><textarea rows="5" oninput="gSet(${pi},${gi},'options',this.value.split('\\n'));" onchange="renderEditor()">${esc((g.options||[]).join('\n'))}</textarea>`;
    if(g.type==='match_info'||g.type==='map_label')extra+=`<label>Hoặc chỉ nhập số lựa chọn (nếu không ghi nội dung)</label><input type="text" value="${g.count||''}" oninput="gSet(${pi},${gi},'count',+this.value||0)" placeholder="Ví dụ: 7 (tức là A đến G)">`;
  }
  if(T.img)extra+=`<label>Hình ảnh (bản đồ, sơ đồ)</label>${g.imgKey?`<div class="row"><span>${esc(g.imgName||'ảnh')}</span><button class="btn small danger" onclick="rmGImg(${pi},${gi})">Xoá ảnh</button></div>`:`<input type="file" accept="image/*" onchange="upGImg(${pi},${gi},this)">`}`;
  const qs=g.questions.map((q,qi)=>{
    const lab=T.kind==='fill'?'Câu (dùng ______ cho chỗ trống)':T.kind==='match'?'Nội dung cần nối (ví dụ: Paragraph B, hoặc một nhận định)':'Nội dung câu hỏi';
    return `<div class="eq"><div class="eqh"><b>Câu ${qi+1}</b><button class="btn small danger" onclick="delQ(${pi},${gi},${qi})">Xoá</button></div>
    <textarea rows="2" placeholder="${lab}" oninput="qSet(${pi},${gi},${qi},'q',this.value)">${esc(q.q)}</textarea>
    ${T.kind==='choice'||T.kind==='multi'?`<textarea rows="5" placeholder="Mỗi dòng một lựa chọn, không cần gõ A, B, C" oninput="qOpts(${pi},${gi},${qi},this.value)">${esc((q.options||[]).join('\n'))}</textarea>`:''}
    ${ansControl(pi,gi,qi,g,q)}
    <textarea rows="2" placeholder="Giải thích đáp án (hiện sau khi nộp bài)" oninput="qSet(${pi},${gi},${qi},'explain',this.value)">${esc(q.explain)}</textarea>
    <input type="text" placeholder="Vị trí trong ${rd?'bài đọc':'transcript'}: chép đúng đoạn chứa đáp án (nhiều đoạn cách nhau bằng |). Bỏ trống để web tự lấy từ phần trích dẫn trong giải thích" value="${esc(q.evidence||'')}" oninput="qSet(${pi},${gi},${qi},'evidence',this.value)">
    ${rd?'':`<input type="text" placeholder="Thời điểm trong audio, ví dụ 01:25 (để tua lại đúng chỗ)" value="${esc(q.time||'')}" oninput="qSet(${pi},${gi},${qi},'time',this.value)">`}</div>`}).join('');
  return `<div class="egrp"><div class="eqh"><b>Nhóm câu hỏi ${gi+1}</b><select onchange="gType(${pi},${gi},this.value)">${types}</select><button class="btn small danger" onclick="delGroup(${pi},${gi})">Xoá nhóm</button></div>
  <label>Đề bài / hướng dẫn (bỏ trống để dùng hướng dẫn chuẩn của dạng bài)</label><input type="text" value="${esc(g.title)}" oninput="gSet(${pi},${gi},'title',this.value)">
  ${extra}<h3 style="margin-top:14px">Câu hỏi</h3>${qs}<button class="btn small" onclick="addQ(${pi},${gi})">Thêm câu hỏi</button></div>`;
}
function renderEditor(){
  const rd=E.skill==='reading';
  const parts=E.parts.map((p,pi)=>`<div class="epart"><div class="row sp"><h3>Part ${pi+1}</h3><button class="btn small danger" onclick="delPart(${pi})">Xoá part</button></div>
  <label>Tên part</label><input type="text" value="${esc(p.title)}" oninput="pSet(${pi},'title',this.value)" placeholder="Ví dụ: Part 1: Urban Beekeeping">
  ${rd?`<label>Bài đọc (dán văn bản, cách đoạn bằng dòng trống)</label><textarea rows="9" oninput="pSet(${pi},'text',this.value)">${esc(p.text)}</textarea>
  <label class="inl"><input type="checkbox" ${p.labelParas?'checked':''} onchange="pSet(${pi},'labelParas',this.checked)">Đánh nhãn đoạn A, B, C... (cần cho Matching Headings, Matching Information)</label>
  <label>Hoặc tải lên file PDF bài đọc</label>${p.pdfKey?`<div class="row"><span>${esc(p.pdfName||'file PDF')}</span><button class="btn small danger" onclick="rmFile(${pi},'pdf')">Xoá file</button></div>`:`<input type="file" accept="application/pdf" onchange="upFile(${pi},'pdf',this)">`}`
  :`<label>File audio (mp3, m4a, wav)</label>${p.audioKey?`<div class="row"><span>${esc(p.audioName||'file audio')}</span><button class="btn small danger" onclick="rmFile(${pi},'audio')">Xoá file</button></div>`:`<input type="file" accept="audio/*" onchange="upFile(${pi},'audio',this)">`}
  <label>Transcript (hiện sau khi nộp bài. Nếu chưa có audio, trình duyệt sẽ đọc transcript bằng giọng máy)</label><textarea rows="6" oninput="pSet(${pi},'tts',this.value)">${esc(p.tts)}</textarea>`}
  ${p.groups.map((g,gi)=>groupEditor(pi,gi,g)).join('')}
  <button class="btn" onclick="addGroup(${pi})">Thêm nhóm câu hỏi</button></div>`).join('');
  app(`<h1>${DB.tests.some(t=>t.id===E.id)?'Sửa đề':'Thêm đề'} ${rd?'Reading':'Listening'}</h1><div class="form">
  <label>Tên đề</label><input type="text" value="${esc(E.title)}" oninput="eSet('title',this.value)" placeholder="Ví dụ: Cambridge 18 Test 1">
  <div class="two"><div><label>Thời gian làm cả đề (phút)</label><input type="text" value="${E.fullMinutes}" oninput="eSet('fullMinutes',+this.value||60)"></div>
  <div><label>Thời gian mini test mỗi part (phút)</label><input type="text" value="${E.partMinutes}" oninput="eSet('partMinutes',+this.value||20)"></div></div>
  ${parts}<div class="row"><button class="btn" onclick="addPart()">Thêm part</button><button class="btn primary" onclick="saveTest()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function saveTest(){
  if(!E.title.trim())return toast('Hãy nhập tên đề.');
  const t=JSON.parse(JSON.stringify(E));
  for(const p of t.parts){
    p.groups=p.groups.filter(g=>g.questions.some(q=>q.q.trim()));
    for(const g of p.groups){
      const T=QT[g.type];
      g.questions=g.questions.filter(q=>q.q.trim());
      if(T.kind==='match'){g.options=(g.options||[]).map(o=>o.trim().replace(/^([A-Za-z]|[ivxIVX]+)[.)]\s+/,'')).filter(Boolean)}
      else g.options=[];
      for(const q of g.questions){
        if(T.kind==='choice'||T.kind==='multi')q.options=(q.options||[]).map(o=>o.trim().replace(/^[A-Ga-g][.)]\s+/,'')).filter(Boolean);
        else q.options=[];
        q.answer=String(q.answer||'').trim();
        if(!q.answer)return toast('Có câu hỏi chưa có đáp án đúng.');
        if(T.kind==='match'&&!gLabels(g).includes(q.answer))return toast('Một đáp án nối không nằm trong danh sách lựa chọn.');
      }
    }
  }
  if(!t.parts.some(p=>p.groups.length))return toast('Đề cần ít nhất 1 câu hỏi.');
  const i=DB.tests.findIndex(x=>x.id===t.id);
  if(i>=0)DB.tests[i]=t;else DB.tests.push(t);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}

/* ---- writing / speaking editors ---- */
let EW=null,ES=null;
const kindOpts=(map,cur)=>'<option value="">Chưa phân loại</option>'+Object.keys(map).map(k=>`<option value="${k}" ${cur===k?'selected':''}>${esc(map[k])}</option>`).join('');
function editWriting(id){
  const ex=DB.writing.find(x=>x.id===id);
  EW=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),task:2,kind:'',title:'',prompt:'',imgKey:null,imgName:''};
  renderEW();
}
function renderEW(){
  app(`<h1>${DB.writing.some(x=>x.id===EW.id)?'Sửa':'Thêm'} đề Writing</h1><div class="form">
  <label>Loại</label><select onchange="EW.task=+this.value;EW.kind='';renderEW()"><option value="1" ${EW.task===1?'selected':''}>Task 1 (20 phút)</option><option value="2" ${EW.task===2?'selected':''}>Task 2 (40 phút)</option></select>
  <label>Dạng bài</label><select onchange="EW.kind=this.value">${kindOpts(EW.task===1?W1KIND:W2KIND,EW.kind)}</select>
  <label>Tên đề</label><input type="text" value="${esc(EW.title)}" oninput="EW.title=this.value">
  <label>Nội dung đề bài</label><textarea rows="10" oninput="EW.prompt=this.value">${esc(EW.prompt)}</textarea>
  <label>Hình ảnh biểu đồ, bản đồ, quy trình (chủ yếu cho Task 1, không bắt buộc)</label>
  ${EW.imgKey?`<div class="row"><span>${esc(EW.imgName||'ảnh')}</span><button class="btn small danger" onclick="rmWImg()">Xoá ảnh</button></div>`:`<input type="file" accept="image/*" onchange="upWImg(this)">`}
  <div class="row" style="margin-top:18px"><button class="btn primary" onclick="saveWriting()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
async function upWImg(inp){const f=inp.files[0];if(!f)return;await fdel(EW.imgKey);EW.imgKey='f_'+uid();EW.imgName=f.name;await fput(EW.imgKey,f);renderEW()}
async function rmWImg(){await fdel(EW.imgKey);EW.imgKey=null;EW.imgName='';renderEW()}
function saveWriting(){
  if(!EW.title.trim()||!EW.prompt.trim())return toast('Hãy nhập tên đề và nội dung đề bài.');
  const i=DB.writing.findIndex(x=>x.id===EW.id);if(i>=0)DB.writing[i]=EW;else DB.writing.push(EW);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}
function editSpeaking(id){
  const ex=DB.speaking.find(x=>x.id===id);
  ES=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),part:1,kind:'',title:'',content:''};
  renderES();
}
function renderES(){
  app(`<h1>${DB.speaking.some(x=>x.id===ES.id)?'Sửa':'Thêm'} đề Speaking</h1><div class="form">
  <label>Part</label><select onchange="ES.part=+this.value;ES.kind='';renderES()">${[1,2,3].map(n=>`<option value="${n}" ${ES.part===n?'selected':''}>Part ${n}</option>`).join('')}</select>
  <label>${ES.part===1?'Chủ đề':ES.part===2?'Dạng cue card':'Dạng câu hỏi'}</label><select onchange="ES.kind=this.value">${kindOpts(SKIND[ES.part],ES.kind)}</select>
  <label>Tên đề</label><input type="text" value="${esc(ES.title)}" oninput="ES.title=this.value">
  <label>Nội dung (Part 1 và Part 3: mỗi dòng một câu hỏi. Part 2: dán cả cue card)</label><textarea rows="10" oninput="ES.content=this.value">${esc(ES.content)}</textarea>
  <div class="row" style="margin-top:18px"><button class="btn primary" onclick="saveSpeaking()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function saveSpeaking(){
  if(!ES.title.trim()||!ES.content.trim())return toast('Hãy nhập tên đề và nội dung.');
  const i=DB.speaking.findIndex(x=>x.id===ES.id);if(i>=0)DB.speaking[i]=ES;else DB.speaking.push(ES);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}

/* ---- JSON import ---- */
function importJsonPage(){
  app(`<h1>Nhập đề từ JSON</h1><p class="lead">Dán JSON dạng <code>{"tests":[...],"writing":[...],"speaking":[...]}</code>. Bạn có thể nhờ Claude soạn đề theo đúng định dạng này (chỉ nội dung chữ, file PDF, audio và hình ảnh tải lên trong màn hình sửa đề). Các giá trị <code>type</code> hợp lệ: ${Object.keys(QT).join(', ')}.</p>
  <div class="form"><textarea id="jsonin" rows="16" placeholder='{"tests":[{"skill":"reading","title":"...","fullMinutes":60,"partMinutes":20,"parts":[{"title":"Part 1","text":"...","labelParas":true,"groups":[{"type":"mcq","questions":[{"q":"...","options":["...","..."],"answer":"B","explain":"..."}]},{"type":"match_headings","options":["heading 1","heading 2"],"questions":[{"q":"Paragraph A","answer":"ii"}]}]}]}]}'></textarea>
  <div class="row" style="margin-top:14px"><button class="btn primary" onclick="doImportJson()">Nhập đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function doImportJson(){
  try{
    let d=JSON.parse($('#jsonin').value);if(Array.isArray(d))d={tests:d};
    let n=0;
    (d.tests||[]).forEach(t=>{
      if(!['reading','listening'].includes(t.skill)||!t.title||!Array.isArray(t.parts))throw new Error('Đề thiếu skill, title hoặc parts.');
      t.id=uid();t.fullMinutes=t.fullMinutes||60;t.partMinutes=t.partMinutes||(t.skill==='reading'?20:10);
      t.parts.forEach(p=>{
        p.text=p.text||'';p.tts=p.tts||'';p.pdfKey=null;p.audioKey=null;p.labelParas=!!p.labelParas;
        (p.groups||[]).forEach(g=>{
          if(!QT[g.type])throw new Error('Dạng bài không hợp lệ: '+g.type);
          g.title=g.title||'';g.maxWords=g.maxWords||0;g.options=g.options||[];g.count=g.count||0;g.imgKey=null;g.imgName='';
          g.questions=(g.questions||[]).map(q=>({q:q.q||'',options:q.options||[],answer:String(q.answer||''),explain:q.explain||'',evidence:q.evidence||'',time:q.time||''}));
        });
      });
      DB.tests.push(t);n++;
    });
    migrate({tests:d.tests||[]});
    (d.writing||[]).forEach(w=>{DB.writing.push({id:uid(),task:w.task===1?1:2,kind:w.kind||'',title:w.title||'Đề Writing',prompt:w.prompt||'',imgKey:null});n++});
    (d.speaking||[]).forEach(s=>{DB.speaking.push({id:uid(),part:[1,2,3].includes(s.part)?s.part:1,kind:s.kind||'',title:s.title||'Đề Speaking',content:s.content||''});n++});
    save();toast('Đã nhập '+n+' đề.');location.hash='#/manage';
  }catch(e){toast('JSON không hợp lệ: '+e.message)}
}

/* ============ backup ============ */
function backupPage(){
  app(`<h1>Sao lưu</h1><p class="lead">Toàn bộ dữ liệu (đề, bài làm, file PDF, audio, bản ghi âm) nằm trong trình duyệt này. Nếu xoá dữ liệu trình duyệt hoặc đổi máy, bạn sẽ mất hết. Hãy xuất bản sao lưu thường xuyên.</p>
  <div class="row"><button class="btn primary" onclick="exportAll()">Xuất bản sao lưu</button>
  <label class="btn">Nhập bản sao lưu<input type="file" accept="application/json" style="display:none" onchange="importAll(this)"></label>
  <button class="btn" onclick="restoreSamples()">Khôi phục đề mẫu</button></div>
  <p class="muted" style="margin-top:18px">Lưu ý: nhập bản sao lưu sẽ thay thế toàn bộ dữ liệu hiện tại.</p>`);
}
const toDataUrl=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
async function exportAll(){
  toast('Đang xuất dữ liệu...');
  const files={};for(const k of await fkeys()){const b=await fget(k);if(b)files[k]=await toDataUrl(b)}
  download('ielts-studio-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({db:DB,files})],{type:'application/json'}));
}
async function importAll(inp){
  const f=inp.files[0];if(!f)return;
  if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng bản sao lưu này?'))return;
  try{
    const d=JSON.parse(await f.text());if(!d.db||!d.db.tests)throw new Error('File không đúng định dạng.');
    for(const k of await fkeys())await fdel(k);
    for(const k in d.files||{}){const b=await (await fetch(d.files[k])).blob();await fput(k,b)}
    DB=migrate(d.db);save();toast('Đã nhập bản sao lưu.');location.hash='#/';
  }catch(e){toast('Không nhập được: '+e.message)}
}
function restoreSamples(){
  const s=samples();
  s.tests.forEach(t=>{if(!DB.tests.some(x=>x.id===t.id))DB.tests.push(t)});
  s.writing.forEach(t=>{if(!DB.writing.some(x=>x.id===t.id))DB.writing.push(t)});
  s.speaking.forEach(t=>{if(!DB.speaking.some(x=>x.id===t.id))DB.speaking.push(t)});
  save();toast('Đã thêm các đề mẫu còn thiếu.');
}

route();
</script>
</body>
</html>

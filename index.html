<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F3;--sheet:#fff;--ink:#1B2A41;--muted:#5B6B7F;--line:#CBD3DC;--blue:#2F5D8A;--mark:#FFE066;--ok:#2E7D4F;--bad:#B3402F;--okbg:#E4F2E9;--badbg:#F8E5E1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{font-family:"Source Serif 4",serif;font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none}
.brand span{background:var(--mark);color:var(--ink);padding:0 6px;margin-left:2px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{color:#C9D4E3;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:.95rem}
nav.main a:hover,nav.main a.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 28px}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:.95rem;padding:9px 16px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover{background:#F4F7FA}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2A3E5C}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
/* home */
.skills{display:grid;gap:0;border-top:2px solid var(--ink)}
.skill{display:grid;grid-template-columns:minmax(150px,1.1fr) 3fr auto;align-items:center;gap:24px;padding:24px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.skill:hover{background:var(--sheet)}
.skill b{font-family:"Source Serif 4",serif;font-size:2.1rem;line-height:1.1;background:linear-gradient(transparent 62%,var(--mark) 62%);justify-self:start}
.skill p{margin:0;color:var(--muted)}
.skill .go{font-weight:600;white-space:nowrap}
@media(max-width:720px){.skill{grid-template-columns:1fr;gap:6px}}
/* lists */
.test{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--blue);padding:18px 20px;margin-bottom:16px;border-radius:4px}
.test .sub{color:var(--muted);margin:0 0 12px}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.minis em{font-style:normal;color:var(--muted);font-size:.9rem;margin-right:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.empty{background:var(--sheet);border:2px dashed var(--line);padding:28px;text-align:center;color:var(--muted);border-radius:6px}
/* runner */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:10px 16px;margin-bottom:14px}
.clock{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:6px}
.clock.warn{background:var(--mark)}
.clock.urgent{background:var(--bad);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;padding:8px 14px;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;cursor:pointer}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.src,.qs,.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.src{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media(max-width:900px){.src{position:static;max-height:none}}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 1em}
.pdf{width:100%;height:70vh;border:1px solid var(--line)}
.q{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qn{font-weight:700;background:var(--ink);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.9rem}
.qt{margin:0 0 8px;font-weight:500}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:#F0F4F8}
.opt input{margin-top:5px}
input[type=text],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.score{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin:6px 0 20px}
.score .big{font-family:"Source Serif 4",serif;font-size:3.6rem;font-weight:700;line-height:1;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.rv{border:1px solid var(--line);border-left-width:5px;border-radius:4px;padding:12px 16px;margin-bottom:10px;background:var(--sheet)}
.rv.ok{border-left-color:var(--ok)}
.rv.no{border-left-color:var(--bad)}
.rv .you{font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:var(--badbg);color:var(--bad)}
.exp{background:#F4F7FA;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.muted{color:var(--muted)}
.wc{font-weight:600}
.wc.low{color:var(--bad)}
.wc.ok{color:var(--ok)}
.essay{width:100%;min-height:55vh;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.promptbox{white-space:pre-wrap;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem}
.promptbox img{max-width:100%}
.cue{white-space:pre-wrap;font-family:"Source Serif 4",serif;font-size:1.2rem;border:2px solid var(--ink);padding:18px 22px;border-radius:4px;background:#fffbe6}
/* forms */
.form label{display:block;font-weight:600;margin:14px 0 5px;font-size:.92rem}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.epart{border:1.5px solid var(--ink);border-radius:8px;padding:16px;margin:16px 0;background:var(--sheet)}
.eq{border:1px solid var(--line);border-radius:6px;padding:12px;margin:12px 0;background:#FAFBFC}
.eqh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.eqh select{width:auto}
.eq textarea,.eq input{margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;background:var(--sheet)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:.95rem}
table.t th{background:#F4F7FA}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
audio{width:100%;margin:6px 0}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}#toast{transition:none}}
.err{color:var(--bad);font-weight:600}
</style>
</head>

<header class="top">
  <a class="brand" href="#/">IELTS<span>Studio</span></a>
  <nav class="main">
    <a href="#/" data-k="home">Trang chủ</a>
    <a href="#/manage" data-k="manage">Quản lý đề</a>
    <a href="#/history" data-k="history">Lịch sử</a>
    <a href="#/backup" data-k="backup">Sao lưu</a>
  </nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const paras=t=>String(t||'').split(/\n\s*\n/).filter(x=>x.trim()).map(p=>'<p>'+esc(p.trim())+'</p>').join('');
const fdate=d=>new Date(d).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const wcount=t=>t.trim()?t.trim().split(/\s+/).length:0;
function app(h){$('#app').innerHTML=h;window.scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
let cleanups=[];
const onLeave=f=>cleanups.push(f);
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Đã sao chép. Dán vào chat IELTS với Claude để được chấm.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Đã sao chép.')}
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ file storage (IndexedDB) ============ */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('ielts_studio_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(k,b)=>{const d=await idb;return new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})};
const fget=async k=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fdel=async k=>{if(!k)return;const d=await idb;return new Promise(res=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').delete(k);tx.oncomplete=res;tx.onerror=res})};
const fkeys=async()=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
async function blobUrl(k){const b=await fget(k);if(!b)return null;const u=URL.createObjectURL(b);onLeave(()=>URL.revokeObjectURL(u));return u}

/* ============ data ============ */
const KEY='ielts_studio_v1';
const SAMPLE_IDS=['sample-r1','sample-l1','sample-w1','sample-w2','sample-w3','sample-s1','sample-s2','sample-s3'];
function samples(){return{
tests:[
{id:'sample-r1',skill:'reading',title:'Reading mẫu: Bees and Memory',fullMinutes:60,partMinutes:20,parts:[
 {title:'Part 1: Urban Beekeeping',text:`Over the past fifteen years, keeping bees on city rooftops has moved from an eccentric hobby to a mainstream activity. In London, the number of registered hives roughly tripled between 2008 and 2018, and similar growth has been reported in Paris, New York and Tokyo. Supporters argue that cities offer a surprisingly good environment for bees: gardens, parks and window boxes provide flowers from early spring to late autumn, while pesticide use is far lower than on intensive farmland.

However, not all ecologists are enthusiastic. A 2019 study of hives in one European capital found that so many colonies had been introduced that wild pollinators, such as solitary bees and hoverflies, were competing with honeybees for a limited supply of nectar. Researchers noted that honeybees are managed livestock rather than a threatened species, and that planting more flowers would help conservation more than installing more hives.

Beekeepers, for their part, say the hobby has educational benefits. Many urban hives are run by schools and community groups, and participants often become more interested in protecting green space. A survey of 200 new beekeepers found that two thirds had since planted bee-friendly flowers at home. The authors of the 2019 study accept this point, and suggest that cities should limit hive density instead of banning hives.`,
 pdfKey:null,audioKey:null,tts:'',questions:[
 {type:'tfng',q:'The number of registered hives in London more than doubled between 2008 and 2018.',answer:'TRUE',explain:'Đoạn 1: "roughly tripled" nghĩa là gấp ba, tức là hơn gấp đôi. Chú ý: tripled là tăng nhiều hơn doubled nên câu này vẫn TRUE.'},
 {type:'tfng',q:'Honeybees are classed as an endangered species.',answer:'FALSE',explain:'Đoạn 2: honeybees là "managed livestock rather than a threatened species", trái ngược với câu hỏi.'},
 {type:'tfng',q:'The 2019 study was carried out in London.',answer:'NOT GIVEN',explain:'Bài chỉ nói "one European capital", không nêu tên thành phố nên không có thông tin.'},
 {type:'mcq',q:'According to the second paragraph, what concerns some ecologists?',options:['Honeybees spread disease to wild bees.','Too many hives may reduce the food available to wild pollinators.','Rooftop hives produce poor-quality honey.','City flowers are harmful to bees.'],answer:'B',explain:'"competing with honeybees for a limited supply of nectar" được diễn đạt lại thành "reduce the food available to wild pollinators".'},
 {type:'mcq',q:'What do the authors of the 2019 study recommend?',options:['Banning all urban hives','Limiting hive density','Replacing honeybees with solitary bees','Moving hives to farmland'],answer:'B',explain:'Câu cuối: "cities should limit hive density instead of banning hives".'},
 {type:'fill',q:'Two thirds of the new beekeepers surveyed had planted ______ flowers at home.',answer:'bee-friendly|bee friendly',explain:'Đoạn 3: "planted bee-friendly flowers at home". Chú ý giới hạn từ khi làm bài thật.'}
 ]},
 {title:'Part 2: Why We Forget',text:`Most people assume that forgetting is a failure of memory, but many psychologists now argue that it is an essential feature. The brain receives far more information each day than it could ever store, and forgetting helps it to discard details that are unlikely to be useful again.

One influential idea is the "forgetting curve", proposed by Hermann Ebbinghaus in the 1880s. After memorising lists of meaningless syllables, he tested himself at intervals and found that most of the material was lost within the first hour or two, with the rate of loss slowing afterwards. Modern replications have largely confirmed his pattern, although meaningful material, such as a story, is forgotten more slowly.

Ebbinghaus also showed that spacing study sessions over several days produces better long-term retention than a single long session. Educators have since applied this finding in language courses and medical training, where revision is scheduled at increasing intervals. Nevertheless, many students still rely on last-minute cramming, partly because it feels productive even though results are poorer.`,
 pdfKey:null,audioKey:null,tts:'',questions:[
 {type:'tfng',q:'Ebbinghaus tested himself rather than other participants.',answer:'TRUE',explain:'"he tested himself at intervals".'},
 {type:'mcq',q:'Why do many psychologists see forgetting as useful?',options:['It makes people more creative.','It removes information that is unlikely to be needed.','It reduces stress.','It improves attention in class.'],answer:'B',explain:'"forgetting helps it to discard details that are unlikely to be useful again".'},
 {type:'tfng',q:'Meaningful material such as stories is forgotten more quickly than meaningless syllables.',answer:'FALSE',explain:'Bài nói meaningful material "is forgotten more slowly".'},
 {type:'fill',q:'Spacing study sessions over several ______ gives better long-term retention than one long session.',answer:'days',explain:'"spacing study sessions over several days".'},
 {type:'tfng',q:'Many students prefer cramming because it produces better results.',answer:'FALSE',explain:'Cramming chỉ "feels productive even though results are poorer", tức là kết quả kém hơn.'}
 ]}]},
{id:'sample-l1',skill:'listening',title:'Listening mẫu (giọng đọc máy)',fullMinutes:60,partMinutes:10,parts:[
 {title:'Part 1: Language Course',text:'',pdfKey:null,audioKey:null,tts:`Good morning, and welcome to the Riverside Language Centre. I'd like to give you some information about the evening Spanish course. The course begins on the fourteenth of January and runs for ten weeks. Classes are held in Room Five on the second floor, from six thirty until eight thirty. The total fee is two hundred and forty pounds, which includes all course books, but you will need to bring your own dictionary. If you would like to join, please contact the course organiser, Ms Hartley, on zero one six one, five five five, zero one nine eight. Registration closes on the tenth of January, so please call as soon as possible.`,questions:[
 {type:'fill',q:'The course lasts ______ weeks.',answer:'10|ten',explain:'"runs for ten weeks".'},
 {type:'fill',q:'Classes are held in Room ______.',answer:'5|five',explain:'"Room Five on the second floor".'},
 {type:'fill',q:'The total fee is £______.',answer:'240|two hundred and forty',explain:'"two hundred and forty pounds".'},
 {type:'mcq',q:'What must students bring themselves?',options:['A textbook','A dictionary','A laptop','Headphones'],answer:'B',explain:'Sách giáo trình đã gồm trong học phí, nhưng "you will need to bring your own dictionary".'},
 {type:'fill',q:'Registration closes on the ______ of January.',answer:'10th|tenth|10|ten',explain:'"Registration closes on the tenth of January".'}
 ]},
 {title:'Part 2: City Bike Scheme',text:'',pdfKey:null,audioKey:null,tts:`Thank you all for coming. I'm going to explain how the new city bike scheme will work. There are forty stations across the centre, and each has between ten and twenty bikes. To use a bike, you first need to download the app and register with a debit card. The first thirty minutes of each journey are free; after that the charge is one pound per half hour. Bikes must be returned to a station, and if you leave a bike outside a station you will be charged a five pound fee. The scheme is open from six a.m. until midnight, but the operators plan to extend this to twenty-four hours next year, once they have recruited more maintenance staff.`,questions:[
 {type:'mcq',q:'How do users register for the scheme?',options:['At a station kiosk','Through a mobile app','By phoning the council','At the library'],answer:'B',explain:'"download the app and register with a debit card".'},
 {type:'mcq',q:'How long is each journey free of charge?',options:['15 minutes','30 minutes','1 hour','All day'],answer:'B',explain:'"The first thirty minutes of each journey are free".'},
 {type:'tfng',q:'Bikes can be left anywhere in the centre without charge.',answer:'FALSE',explain:'Để xe ngoài trạm sẽ bị phạt 5 bảng.'},
 {type:'fill',q:'The fee for leaving a bike outside a station is £______.',answer:'5|five',explain:'"a five pound fee".'},
 {type:'mcq',q:'Why is the scheme not yet open 24 hours a day?',options:['Lack of funding','Too few maintenance staff','Safety concerns','Council rules'],answer:'B',explain:'"once they have recruited more maintenance staff".'}
 ]}]}
],
writing:[
{id:'sample-w1',task:1,title:'Task 1: Internet access (bảng số liệu minh hoạ)',imgKey:null,prompt:`The table below shows the percentage of households with internet access in four countries in 2005, 2015 and 2025. (Illustrative data for practice.)

function seed(){const s=samples();return{tests:s.tests,writing:s.writing,speaking:s.speaking,attempts:[],essays:[],recs:[],drafts:{}}}
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
if(!DB||!DB.tests)DB=seed();
['writing','speaking','attempts','essays','recs'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});
if(!DB.drafts)DB.drafts={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Không lưu được dữ liệu: bộ nhớ trình duyệt đã đầy.')}}

/* ============ scoring ============ */
const BANDS={reading:[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4]],
listening:[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4]]};
function bandOf(skill,correct,total){
  const raw=total?Math.round(correct/total*40):0;
  const row=(BANDS[skill]||BANDS.reading).find(r=>raw>=r[0]);
  return row?row[1]:3.5;
}
const normAns=s=>String(s).toLowerCase().replace(/[£$,]/g,'').replace(/\.$/,'').replace(/\s+/g,' ').trim();
function isRight(q,a){
  if(a==null||a==='')return false;
  if(q.type==='fill')return String(q.answer).split('|').some(x=>normAns(x)===normAns(a));
  return String(a).toUpperCase()===String(q.answer).toUpperCase();
}

/* ============ router ============ */
function route(){
  cleanup();
  const [a,b,c]=location.hash.replace(/^#\/?/,'').split('/');
  document.querySelectorAll('nav.main a').forEach(x=>x.classList.toggle('on',x.dataset.k===(a||'home')));
  try{
    if(!a)return home();
    if(a==='list')return listPage(b);
    if(a==='run')return runTest(b,c);
    if(a==='write')return writeRun(b);
    if(a==='speak')return speakRun(b);
    if(a==='manage')return managePage();
    if(a==='edit')return editTest(b);
    if(a==='editw')return editWriting(b);
    if(a==='edits')return editSpeaking(b);
    if(a==='history')return historyPage();
    if(a==='backup')return backupPage();
    home();
  }catch(e){console.error(e);app('<p class="err">Có lỗi: '+esc(e.message)+'</p><a href="#/">Về trang chủ</a>')}
}
window.addEventListener('hashchange',route);

/* ============ home & lists ============ */
function home(){
  const n=k=>DB.tests.filter(t=>t.skill===k).length;
  app(`<h1>Hôm nay luyện kỹ năng nào?</h1>
  <p class="lead">Mục tiêu: từ band 7.0 lên 8.0 hoặc 8.5. Chọn một kỹ năng, bấm giờ và làm bài như thi thật.</p>
  <nav class="skills">
    <a class="skill" href="#/list/reading"><b>Reading</b><p>Đề đầy đủ 60 phút hoặc mini test từng part. Tự chấm điểm và có giải thích. Hiện có ${n('reading')} đề.</p><span class="go">Vào làm bài</span></a>
    <a class="skill" href="#/list/listening"><b>Listening</b><p>Đề đầy đủ 60 phút hoặc mini test từng part, có trình phát audio. Hiện có ${n('listening')} đề.</p><span class="go">Vào làm bài</span></a>
    <a class="skill" href="#/list/writing"><b>Writing</b><p>Task 1 trong 20 phút, Task 2 trong 40 phút. Có đếm từ và nút sao chép bài để gửi chấm. Hiện có ${DB.writing.length} đề.</p><span class="go">Vào làm bài</span></a>
    <a class="skill" href="#/list/speaking"><b>Speaking</b><p>Part 1, Part 2 (1 phút chuẩn bị, 2 phút nói) và Part 3, kèm ghi âm. Hiện có ${DB.speaking.length} đề.</p><span class="go">Vào luyện</span></a>
  </nav>
  <p class="muted" style="margin-top:24px">Dữ liệu được lưu trong trình duyệt này. Nhớ vào mục Sao lưu để xuất bản sao lưu định kỳ.</p>`);
}
function bestOf(id){const a=DB.attempts.filter(x=>x.testId===id&&x.scope==='all');return a.length?Math.max(...a.map(x=>x.band)):null}
function listPage(k){
  if(k==='writing')return listWriting();
  if(k==='speaking')return listSpeaking();
  const name=k==='reading'?'Reading':'Listening';
  const tests=DB.tests.filter(t=>t.skill===k);
  app(`<div class="row sp"><h1>${name}</h1><a class="btn" href="#/edit/new-${k}">Thêm đề ${name}</a></div>
  <p class="lead">Làm cả đề để thi thử đủ thời gian, hoặc làm mini test để luyện từng part.</p>
  ${tests.length?tests.map(t=>{
    const nq=t.parts.reduce((s,p)=>s+p.questions.length,0);
    const pm=t.partMinutes||(k==='reading'?20:10);
    const best=bestOf(t.id);
    return `<article class="test"><h3>${esc(t.title)}</h3>
    <p class="sub">${t.parts.length} part, ${nq} câu hỏi${best?`. Band ước tính cao nhất khi làm cả đề: ${best}`:''}</p>
    <a class="btn primary" href="#/run/${t.id}/all">Làm cả đề, ${t.fullMinutes||60} phút</a>
    <div class="minis"><em>Mini test:</em>${t.parts.map((p,i)=>`<a class="btn small" href="#/run/${t.id}/${i}">${esc(p.title||'Part '+(i+1))}, ${pm} phút</a>`).join('')}</div></article>`}).join(''):
    `<div class="empty">Chưa có đề ${name}. Bấm "Thêm đề ${name}" để tạo đề đầu tiên.</div>`}`);
}
function listWriting(){
  const grp=n=>DB.writing.filter(x=>x.task===n);
  const sec=(n,m)=>`<h2>Task ${n}, ${m} phút</h2>${grp(n).length?grp(n).map(w=>`<article class="test"><h3>${esc(w.title)}</h3><a class="btn primary" href="#/write/${w.id}">Làm bài</a></article>`).join(''):`<div class="empty">Chưa có đề Task ${n}.</div>`}`;
  app(`<div class="row sp"><h1>Writing</h1><a class="btn" href="#/editw/new">Thêm đề Writing</a></div>
  <p class="lead">Sau khi nộp, bấm sao chép bài kèm yêu cầu chấm rồi dán vào chat IELTS với Claude.</p>${sec(1,20)}${sec(2,40)}`);
}
function listSpeaking(){
  const sec=n=>{const g=DB.speaking.filter(x=>x.part===n);return `<h2>Part ${n}</h2>${g.length?g.map(s=>`<article class="test"><h3>${esc(s.title)}</h3><a class="btn primary" href="#/speak/${s.id}">Luyện nói</a></article>`).join(''):`<div class="empty">Chưa có đề Part ${n}.</div>`}`};
  app(`<div class="row sp"><h1>Speaking</h1><a class="btn" href="#/edits/new">Thêm đề Speaking</a></div>
  <p class="lead">Bật ghi âm để lưu lại bài nói, sau đó nghe lại hoặc tải về gửi cho Claude chấm.</p>${sec(1)}${sec(2)}${sec(3)}`);
}

/* ============ test runner (reading / listening) ============ */
let R=null;
function runTest(id,scope){
  const t=DB.tests.find(x=>x.id===id);
  if(!t)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const idxs=scope==='all'?t.parts.map((_,i)=>i):[Number(scope)];
  const mins=scope==='all'?(t.fullMinutes||60):(t.partMinutes||(t.skill==='reading'?20:10));
  R={t,idxs,scope,ans:{},cur:idxs[0],left:mins*60,total:mins*60,started:false,done:false,iv:null};
  onLeave(()=>{clearInterval(R&&R.iv);try{speechSynthesis.cancel()}catch(e){}});
  const nq=idxs.reduce((s,i)=>s+t.parts[i].questions.length,0);
  app(`<div class="panel"><h1>${esc(t.title)}</h1>
  <p>${scope==='all'?'Làm cả đề':'Mini test: '+esc(t.parts[idxs[0]].title)}. Thời gian: <b>${mins} phút</b>. Số câu hỏi: <b>${nq}</b>.</p>
  <p class="muted">Đồng hồ bắt đầu chạy khi bạn bấm nút bên dưới. Hết giờ, bài sẽ tự nộp.${t.skill==='listening'?' Hãy đeo tai nghe và kiểm tra âm lượng trước khi bắt đầu.':''}</p>
  <button class="btn primary" onclick="beginTest()">Bắt đầu làm bài</button> <a class="btn" href="#/list/${t.skill}">Quay lại</a></div>`);
}
function beginTest(){
  R.started=true;
  R.iv=setInterval(()=>{R.left--;updateClock();if(R.left<=0)finishTest(true)},1000);
  renderRun();
}
function updateClock(){
  const c=$('#clock');if(!c)return;
  c.textContent=fmt(R.left);
  c.className='clock'+(R.left<=60?' urgent':R.left<=300?' warn':'');
}
const qNo=(pi,qi)=>{let n=0;for(const i of R.idxs){if(i===pi)return n+qi+1;n+=R.t.parts[i].questions.length}return qi+1};
function goPart(i){R.cur=i;renderRun()}
function setAns(k,v){R.ans[k]=v}
function renderRun(){
  const {t,idxs,cur}=R,part=t.parts[cur];
  const tabs=idxs.length>1?`<div class="tabs">${idxs.map(i=>`<button class="tab ${i===cur?'on':''}" onclick="goPart(${i})">${esc(t.parts[i].title||'Part '+(i+1))}</button>`).join('')}</div>`:'';
  let src='';
  if(t.skill==='reading'){
    src=`<h2>${esc(part.title)}</h2>${part.text?`<div class="passage">${paras(part.text)}</div>`:''}${part.pdfKey?`<p><a id="pdfopen" target="_blank" rel="noopener">Mở PDF trong tab mới</a></p><iframe id="pdfv" class="pdf" title="Bài đọc PDF"></iframe>`:''}${!part.text&&!part.pdfKey?'<p class="muted">Part này chưa có nội dung bài đọc.</p>':''}`;
  }else{
    src=`<h2>${esc(part.title)}</h2>${part.audioKey?`<audio id="aud" controls preload="auto"></audio><p class="muted">Trong bài thi thật bạn chỉ được nghe một lần.</p>`:''}
    ${part.tts?`<p class="muted">Đề mẫu dùng giọng đọc của trình duyệt (kiểu thi thật: chỉ nghe một lần).</p><div class="row"><button class="btn primary" onclick="ttsPlay(${cur})">Phát bài nghe</button><button class="btn" onclick="ttsStop()">Dừng</button></div>`:''}
    ${!part.audioKey&&!part.tts?'<p class="muted">Part này chưa có file audio.</p>':''}`;
  }
  const qs=part.questions.map((q,qi)=>{
    const k=cur+'-'+qi,v=R.ans[k]==null?'':R.ans[k];let inp='';
    if(q.type==='mcq')inp=q.options.map((o,oi)=>{const L=String.fromCharCode(65+oi);return `<label class="opt"><input type="radio" name="r${k}" ${v===L?'checked':''} onchange="setAns('${k}','${L}')"><span>${L}. ${esc(o)}</span></label>`}).join('');
    else if(q.type==='tfng')inp=['TRUE','FALSE','NOT GIVEN'].map(o=>`<label class="opt"><input type="radio" name="r${k}" ${v===o?'checked':''} onchange="setAns('${k}','${o}')"><span>${o}</span></label>`).join('');
    else inp=`<input type="text" value="${esc(v)}" autocomplete="off" aria-label="Đáp án câu ${qNo(cur,qi)}" oninput="setAns('${k}',this.value)">`;
    return `<div class="q"><div class="qn">${qNo(cur,qi)}</div><div><p class="qt">${esc(q.q)}</p>${inp}</div></div>`}).join('');
  app(`<div class="bar"><strong>${esc(t.title)}</strong><div class="clock" id="clock">${fmt(R.left)}</div><button class="btn primary" onclick="finishTest()">Nộp bài</button></div>${tabs}
  <div class="split"><section class="src">${src}</section><section class="qs">${qs||'<p class="muted">Part này chưa có câu hỏi.</p>'}</section></div>`);
  updateClock();
  if(part.pdfKey)blobUrl(part.pdfKey).then(u=>{if(u){$('#pdfv').src=u;$('#pdfopen').href=u}});
  if(part.audioKey)blobUrl(part.audioKey).then(u=>{if(u&&$('#aud'))$('#aud').src=u});
}
function ttsPlay(pi){
  try{
    speechSynthesis.cancel();
    const txt=R.t.parts[pi].tts;
    (txt.match(/[^.!?]+[.!?]*/g)||[txt]).forEach(s=>{if(!s.trim())return;const u=new SpeechSynthesisUtterance(s.trim());u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)});
  }catch(e){toast('Trình duyệt không hỗ trợ giọng đọc.')}
}
function ttsStop(){try{speechSynthesis.cancel()}catch(e){}}
function finishTest(auto){
  if(!R||R.done)return;
  let total=0,done=0;
  R.idxs.forEach(i=>R.t.parts[i].questions.forEach((q,qi)=>{total++;if(R.ans[i+'-'+qi])done++}));
  if(!auto&&!confirm(done<total?`Còn ${total-done} câu chưa trả lời. Nộp bài?`:'Nộp bài ngay?'))return;
  R.done=true;clearInterval(R.iv);ttsStop();
  let correct=0;const rows=[];
  R.idxs.forEach(i=>{const p=R.t.parts[i];p.questions.forEach((q,qi)=>{
    const a=R.ans[i+'-'+qi],ok=isRight(q,a);if(ok)correct++;
    const shown=v=>q.type==='mcq'&&v?(v+'. '+(q.options[v.charCodeAt(0)-65]||'')):(v||'');
    const right=q.type==='fill'?String(q.answer).split('|').join(' / '):shown(q.answer);
    rows.push(`<div class="rv ${ok?'ok':'no'}"><span class="tag ${ok?'ok':'no'}">${ok?'Đúng':'Sai'}</span> <b>Câu ${qNo(i,qi)}.</b> ${esc(q.q)}
    <div class="you">Bạn trả lời: <b>${a?esc(shown(a)):'(bỏ trống)'}</b>${ok?'':` &nbsp; Đáp án đúng: <b>${esc(right)}</b>`}</div>
    ${q.explain?`<div class="exp"><b>Giải thích:</b> ${esc(q.explain)}</div>`:''}</div>`)})});
  const band=bandOf(R.t.skill,correct,total),used=R.total-R.left;
  DB.attempts.push({id:uid(),testId:R.t.id,title:R.t.title,skill:R.t.skill,scope:R.scope==='all'?'all':'part',partName:R.scope==='all'?'':R.t.parts[R.idxs[0]].title,date:Date.now(),correct,total,band,secs:used});
  save();
  const trans=R.t.skill==='listening'?R.idxs.filter(i=>R.t.parts[i].tts).map(i=>`<details class="panel" style="margin-top:12px"><summary><b>Xem transcript: ${esc(R.t.parts[i].title)}</b></summary><div class="passage" style="margin-top:10px">${paras(R.t.parts[i].tts)}</div></details>`).join(''):'';
  app(`<h1>Kết quả</h1><div class="score"><span class="big">${correct}/${total}</span>
  <span>Band ước tính: <b>${band}</b><br><span class="muted">${total===40?'Theo bảng quy đổi 40 câu':'Quy đổi theo tỉ lệ về thang 40 câu'}</span></span>
  <span>Thời gian dùng: <b>${fmt(used)}</b></span></div>
  <div class="row" style="margin-bottom:18px"><a class="btn primary" href="#/run/${R.t.id}/${R.scope}" onclick="setTimeout(route,0)">Làm lại</a><a class="btn" href="#/list/${R.t.skill}">Danh sách đề</a></div>${rows.join('')}${trans}`);
}

/* ============ writing ============ */
let W=null;
function buildReq(p,text,secs,words){
  return `Please act as my IELTS teacher (band 9.0 level) and mark my IELTS Writing Task ${p.task}.
Please: (1) estimate my band for each criterion (${p.task===1?'Task Achievement':'Task Response'}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy) and my overall band; (2) show my mistakes and how to fix them; (3) suggest band 8+ collocations, vocabulary and structures I can use; (4) show how I could improve my ideas, and give a short model paragraph if useful.

Question:
${p.prompt}

Time used: ${Math.round(secs/60)} minutes (limit ${p.task===1?20:40}) | Word count: ${words}

My answer:
${text}`;
}
function writeRun(id){
  const p=DB.writing.find(x=>x.id===id);
  if(!p)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const mins=p.task===1?20:40,minW=p.task===1?150:250;
  W={p,left:mins*60,total:mins*60,started:false,done:false,iv:null,minW};
  onLeave(()=>clearInterval(W&&W.iv));
  const draft=DB.drafts[id]||'';
  app(`<div class="bar"><strong>${esc(p.title)}</strong><div class="clock" id="clock">${fmt(W.left)}</div><div class="row"><button class="btn" id="wstart" onclick="writeStart()">Bắt đầu tính giờ</button><button class="btn primary" onclick="writeFinish()">Nộp bài</button></div></div>
  <div class="split"><section class="src"><div class="promptbox">${esc(p.prompt)}</div>${p.imgKey?'<p><img id="wimg" alt="Biểu đồ đề bài" style="max-width:100%"></p>':''}</section>
  <section class="panel"><textarea id="essay" class="essay" placeholder="Bấm Bắt đầu tính giờ rồi viết bài ở đây. Bài được tự lưu nháp." disabled>${esc(draft)}</textarea>
  <p class="wc" id="wc"></p></section></div>`);
  const ta=$('#essay');
  const upd=()=>{const n=wcount(ta.value),el=$('#wc');el.textContent=`${n} từ (tối thiểu ${minW})`;el.className='wc '+(n>=minW?'ok':'low');DB.drafts[id]=ta.value;if(!upd.t)upd.t=setTimeout(()=>{upd.t=0;save()},1500)};
  ta.addEventListener('input',upd);upd();
  if(p.imgKey)blobUrl(p.imgKey).then(u=>{if(u&&$('#wimg'))$('#wimg').src=u});
  if(draft)ta.disabled=false;
}
function writeStart(){
  if(W.started)return;W.started=true;
  $('#essay').disabled=false;$('#essay').focus();$('#wstart').disabled=true;
  W.iv=setInterval(()=>{W.left--;const c=$('#clock');if(c){c.textContent=fmt(W.left);c.className='clock'+(W.left<=60?' urgent':W.left<=300?' warn':'')}if(W.left<=0){clearInterval(W.iv);toast('Hết giờ. Hãy nộp bài.');$('#essay').disabled=true}},1000);
}
function writeFinish(){
  if(W.done)return;
  const text=$('#essay').value;
  if(!text.trim()){toast('Bạn chưa viết gì.');return}
  if(W.left>0&&!confirm('Nộp bài và tạo yêu cầu chấm?'))return;
  W.done=true;clearInterval(W.iv);
  const words=wcount(text),secs=W.total-Math.max(0,W.left);
  const req=buildReq(W.p,text,secs,words);
  const e={id:uid(),promptId:W.p.id,title:W.p.title,task:W.p.task,text,words,secs,date:Date.now(),req};
  DB.essays.push(e);delete DB.drafts[W.p.id];save();
  app(`<h1>Đã lưu bài viết</h1><p class="lead">${words} từ, thời gian dùng ${fmt(secs)}. Bấm sao chép rồi dán toàn bộ nội dung vào chat IELTS với Claude để được chấm band và sửa lỗi.</p>
  <div class="row" style="margin-bottom:12px"><button class="btn primary" onclick="copyEssay('${e.id}')">Sao chép bài và yêu cầu chấm</button><a class="btn" href="#/list/writing">Danh sách đề</a><a class="btn" href="#/history">Xem lịch sử</a></div>
  <textarea readonly rows="18" onclick="this.select()">${esc(req)}</textarea>`);
}
function copyEssay(id){const e=DB.essays.find(x=>x.id===id);if(e)copyText(e.req)}

/* ============ speaking ============ */
let S=null;
function speakRun(id){
  const sp=DB.speaking.find(x=>x.id===id);
  if(!sp)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const phases=sp.part===2?[{n:'Chuẩn bị',s:60,rec:false},{n:'Nói',s:120,rec:true}]:[{n:'Trả lời',s:300,rec:true}];
  S={sp,phases,pi:-1,left:0,iv:null,mr:null,stream:null,chunks:[],t0:0};
  onLeave(()=>{clearInterval(S.iv);stopRec(true)});
  const content=sp.part===2?`<div class="cue">${esc(sp.content)}</div>`:`<ol class="passage">${sp.content.split('\n').filter(x=>x.trim()).map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`;
  app(`<h1>${esc(sp.title)}</h1>
  <div class="split"><section class="panel">${content}</section>
  <section class="panel"><div class="clock" id="clock" style="display:inline-block">--:--</div> <b id="phase" style="margin-left:8px">Sẵn sàng</b>
  <p class="muted">${sp.part===2?'Chuẩn bị 1 phút, sau đó nói tối đa 2 phút.':'Trả lời tự nhiên, tối đa 5 phút.'}</p>
  <label class="opt"><input type="checkbox" id="dorec" checked><span>Ghi âm bài nói</span></label>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="sbtn" onclick="speakStart()">Bắt đầu</button><button class="btn" onclick="speakStop()">Dừng</button><button class="btn" onclick="copySpeakReq()">Sao chép đề để gửi chấm</button></div>
  <h3 style="margin-top:22px">Các bản ghi âm của đề này</h3><div id="reclist"></div></section></div>`);
  renderRecs();
}
function copySpeakReq(){
  const sp=S.sp;
  copyText(`Please act as my IELTS Speaking examiner (band 9.0 level). I just practised IELTS Speaking Part ${sp.part}. Please mark my answer on fluency and coherence, lexical resource, grammatical range and accuracy, and pronunciation, show my mistakes and better ways to say it, and give band 8+ vocabulary and ideas.\n\nQuestion(s):\n${sp.content}\n\nMy answer (paste transcript here):\n`);
}
function speakStart(){
  if(S.pi>=0)return;
  nextPhase();
}
function nextPhase(){
  clearInterval(S.iv);S.pi++;
  if(S.pi>=S.phases.length){speakStop();return}
  const ph=S.phases[S.pi];S.left=ph.s;
  $('#phase').textContent=ph.n;$('#sbtn').disabled=true;
  const tick=()=>{const c=$('#clock');if(c){c.textContent=fmt(S.left);c.className='clock'+(S.left<=10?' urgent':'')}};
  tick();
  if(ph.rec&&$('#dorec').checked)startRec();
  S.iv=setInterval(()=>{S.left--;tick();if(S.left<=0){if(S.pi===S.phases.length-1){speakStop()}else nextPhase()}},1000);
}
function speakStop(){
  clearInterval(S.iv);
  if(S.pi>=0){$('#phase').textContent='Đã kết thúc'}
  stopRec(false);S.pi=-1;
  const b=$('#sbtn');if(b)b.disabled=false;
}
async function startRec(){
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    S.mr=new MediaRecorder(S.stream);S.chunks=[];S.t0=Date.now();
    S.mr.ondataavailable=e=>{if(e.data.size)S.chunks.push(e.data)};
    const sp=S.sp,chunks=S.chunks,t0=S.t0,mr=S.mr;
    mr.onstop=async()=>{
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(!blob.size)return;
      const r={id:uid(),spId:sp.id,title:sp.title,date:Date.now(),secs:Math.round((Date.now()-t0)/1000),mime:blob.type};
      await fput('rec_'+r.id,blob);DB.recs.push(r);save();
      if($('#reclist'))renderRecs();
      toast('Đã lưu bản ghi âm.');
    };
    S.mr.start();
    const ph=$('#phase');if(ph)ph.innerHTML='<span class="rec"></span>'+esc(S.phases[S.pi]?S.phases[S.pi].n:'Ghi âm');
  }catch(e){toast('Không bật được micro. Hãy cho phép quyền truy cập micro.')}
}
function stopRec(silent){
  if(S&&S.mr&&S.mr.state!=='inactive'){try{S.mr.stop()}catch(e){}}
  if(S&&S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}
}
function renderRecs(){
  const box=$('#reclist');if(!box)return;
  const rs=DB.recs.filter(r=>r.spId===S.sp.id).reverse();
  box.innerHTML=rs.length?rs.map(r=>`<div class="rv"><b>${fdate(r.date)}</b>, ${fmt(r.secs)}<audio id="a_${r.id}" controls></audio><div class="row"><button class="btn small" onclick="dlRec('${r.id}')">Tải về</button><button class="btn small danger" onclick="delRec('${r.id}')">Xoá</button></div></div>`).join(''):'<p class="muted">Chưa có bản ghi âm nào.</p>';
  rs.forEach(r=>blobUrl('rec_'+r.id).then(u=>{const a=$('#a_'+r.id);if(u&&a)a.src=u}));
}
async function dlRec(id){const r=DB.recs.find(x=>x.id===id),b=await fget('rec_'+id);if(b)download('speaking-'+fdate(r.date).replace(/[^0-9]/g,'')+'.'+(r.mime.includes('mp4')?'m4a':'webm'),b)}
async function delRec(id){if(!confirm('Xoá bản ghi âm này?'))return;await fdel('rec_'+id);DB.recs=DB.recs.filter(x=>x.id!==id);save();(S&&$('#reclist'))?renderRecs():route()}

/* ============ history ============ */
function historyPage(){
  const at=DB.attempts.slice().reverse();
  app(`<h1>Lịch sử</h1><h2>Reading và Listening</h2>
  ${at.length?`<div style="overflow:auto"><table class="t"><tr><th>Ngày</th><th>Kỹ năng</th><th>Đề</th><th>Điểm</th><th>Band ước tính</th><th>Thời gian</th></tr>${at.map(a=>`<tr><td>${fdate(a.date)}</td><td>${a.skill==='reading'?'Reading':'Listening'}</td><td>${esc(a.title)}${a.partName?', '+esc(a.partName):', cả đề'}</td><td>${a.correct}/${a.total}</td><td>${a.band}</td><td>${fmt(a.secs)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa có bài nào.</div>'}
  <h2 style="margin-top:32px">Bài Writing đã nộp</h2>
  ${DB.essays.length?DB.essays.slice().reverse().map(e=>`<div class="rv"><b>${esc(e.title)}</b><br><span class="muted">${fdate(e.date)}, ${e.words} từ, ${fmt(e.secs)}</span><div class="row" style="margin-top:8px"><button class="btn small primary" onclick="copyEssay('${e.id}')">Sao chép bài và yêu cầu chấm</button><button class="btn small danger" onclick="delEssay('${e.id}')">Xoá</button></div></div>`).join(''):'<div class="empty">Chưa có bài Writing nào.</div>'}
  <h2 style="margin-top:32px">Bản ghi âm Speaking</h2>
  ${DB.recs.length?DB.recs.slice().reverse().map(r=>`<div class="rv"><b>${esc(r.title)}</b>, ${fdate(r.date)}, ${fmt(r.secs)}<audio id="a_${r.id}" controls></audio><div class="row"><button class="btn small" onclick="dlRec('${r.id}')">Tải về</button><button class="btn small danger" onclick="delRec('${r.id}')">Xoá</button></div></div>`).join(''):'<div class="empty">Chưa có bản ghi âm nào.</div>'}`);
  DB.recs.forEach(r=>blobUrl('rec_'+r.id).then(u=>{const a=$('#a_'+r.id);if(u&&a)a.src=u}));
}
function delEssay(id){if(!confirm('Xoá bài viết này?'))return;DB.essays=DB.essays.filter(x=>x.id!==id);save();historyPage()}

/* ============ manage ============ */
function managePage(){
  const li=(h,edit,del)=>`<div class="rv"><div class="row sp"><span>${h}</span><span class="row"><a class="btn small" href="${edit}">Sửa</a><button class="btn small danger" onclick="${del}">Xoá</button></span></div></div>`;
  app(`<h1>Quản lý đề</h1><p class="lead">Tạo, sửa, xoá đề và tải lên file PDF hoặc audio. File được lưu trong trình duyệt của bạn, không đưa lên GitHub.</p>
  <div class="row" style="margin-bottom:24px"><a class="btn primary" href="#/edit/new-reading">Thêm đề Reading</a><a class="btn primary" href="#/edit/new-listening">Thêm đề Listening</a><a class="btn" href="#/editw/new">Thêm đề Writing</a><a class="btn" href="#/edits/new">Thêm đề Speaking</a><button class="btn" onclick="importJsonPage()">Nhập đề từ JSON</button></div>
  <h2>Reading và Listening</h2>${DB.tests.length?DB.tests.map(t=>li(`<b>${esc(t.title)}</b> <span class="muted">(${t.skill}, ${t.parts.length} part)</span>`,'#/edit/'+t.id,`delTest('${t.id}')`)).join(''):'<div class="empty">Chưa có đề.</div>'}
  <h2 style="margin-top:28px">Writing</h2>${DB.writing.length?DB.writing.map(w=>li(`<b>${esc(w.title)}</b> <span class="muted">(Task ${w.task})</span>`,'#/editw/'+w.id,`delWriting('${w.id}')`)).join(''):'<div class="empty">Chưa có đề.</div>'}
  <h2 style="margin-top:28px">Speaking</h2>${DB.speaking.length?DB.speaking.map(s=>li(`<b>${esc(s.title)}</b> <span class="muted">(Part ${s.part})</span>`,'#/edits/'+s.id,`delSpeaking('${s.id}')`)).join(''):'<div class="empty">Chưa có đề.</div>'}`);
}
async function delTest(id){const t=DB.tests.find(x=>x.id===id);if(!confirm('Xoá đề "'+t.title+'"?'))return;for(const p of t.parts){await fdel(p.pdfKey);await fdel(p.audioKey)}DB.tests=DB.tests.filter(x=>x.id!==id);save();managePage()}
async function delWriting(id){const w=DB.writing.find(x=>x.id===id);if(!confirm('Xoá đề này?'))return;await fdel(w.imgKey);DB.writing=DB.writing.filter(x=>x.id!==id);save();managePage()}
function delSpeaking(id){if(!confirm('Xoá đề này?'))return;DB.speaking=DB.speaking.filter(x=>x.id!==id);save();managePage()}

/* ---- test editor ---- */
let E=null;
const newQ=()=>({type:'mcq',q:'',options:['','','',''],answer:'',explain:''});
const newPart=()=>({title:'',text:'',pdfKey:null,pdfName:'',audioKey:null,audioName:'',tts:'',questions:[newQ()]});
function editTest(id){
  if(id==='new-reading'||id==='new-listening'){const sk=id.slice(4);E={id:uid(),skill:sk,title:'',fullMinutes:60,partMinutes:sk==='reading'?20:10,parts:[newPart()]}}
  else{const t=DB.tests.find(x=>x.id===id);if(!t)return app('<p class="err">Không tìm thấy đề.</p>');E=JSON.parse(JSON.stringify(t))}
  renderEditor();
}
const eSet=(k,v)=>{E[k]=v};
const pSet=(pi,k,v)=>{E.parts[pi][k]=v};
const qSet=(pi,qi,k,v)=>{E.parts[pi].questions[qi][k]=v};
const qOpts=(pi,qi,v)=>{E.parts[pi].questions[qi].options=v.split('\n')};
function qType(pi,qi,v){const q=E.parts[pi].questions[qi];q.type=v;q.answer='';if(v==='mcq'&&!(q.options&&q.options.length))q.options=['','','',''];renderEditor()}
function addPart(){E.parts.push(newPart());renderEditor()}
function delPart(pi){if(E.parts.length<2)return toast('Đề cần ít nhất 1 part.');if(!confirm('Xoá part này?'))return;E.parts.splice(pi,1);renderEditor()}
function addQ(pi){E.parts[pi].questions.push(newQ());renderEditor()}
function delQ(pi,qi){E.parts[pi].questions.splice(qi,1);renderEditor()}
async function upFile(pi,kind,input){
  const f=input.files[0];if(!f)return;
  const p=E.parts[pi];await fdel(p[kind+'Key']);
  const key='f_'+uid();await fput(key,f);p[kind+'Key']=key;p[kind+'Name']=f.name;toast('Đã tải lên '+f.name);renderEditor();
}
async function rmFile(pi,kind){const p=E.parts[pi];await fdel(p[kind+'Key']);p[kind+'Key']=null;p[kind+'Name']='';renderEditor()}
function renderEditor(){
  const rd=E.skill==='reading';
  const parts=E.parts.map((p,pi)=>`<div class="epart"><div class="row sp"><h3>Part ${pi+1}</h3><button class="btn small danger" onclick="delPart(${pi})">Xoá part</button></div>
  <label>Tên part</label><input type="text" value="${esc(p.title)}" oninput="pSet(${pi},'title',this.value)" placeholder="Ví dụ: Part 1: Urban Beekeeping">
  ${rd?`<label>Bài đọc (dán văn bản, cách đoạn bằng dòng trống)</label><textarea rows="9" oninput="pSet(${pi},'text',this.value)">${esc(p.text)}</textarea>
  <label>Hoặc tải lên file PDF bài đọc</label>${p.pdfKey?`<div class="row"><span>${esc(p.pdfName||'file PDF')}</span><button class="btn small danger" onclick="rmFile(${pi},'pdf')">Xoá file</button></div>`:`<input type="file" accept="application/pdf" onchange="upFile(${pi},'pdf',this)">`}`
  :`<label>File audio (mp3, m4a, wav)</label>${p.audioKey?`<div class="row"><span>${esc(p.audioName||'file audio')}</span><button class="btn small danger" onclick="rmFile(${pi},'audio')">Xoá file</button></div>`:`<input type="file" accept="audio/*" onchange="upFile(${pi},'audio',this)">`}
  <label>Transcript (hiện sau khi nộp bài. Nếu chưa có audio, trình duyệt sẽ đọc transcript bằng giọng máy)</label><textarea rows="6" oninput="pSet(${pi},'tts',this.value)">${esc(p.tts)}</textarea>`}
  <h3 style="margin-top:18px">Câu hỏi</h3>
  ${p.questions.map((q,qi)=>`<div class="eq"><div class="eqh"><b>Câu ${qi+1}</b>
  <select onchange="qType(${pi},${qi},this.value)"><option value="mcq" ${q.type==='mcq'?'selected':''}>Trắc nghiệm</option><option value="tfng" ${q.type==='tfng'?'selected':''}>True / False / Not Given</option><option value="fill" ${q.type==='fill'?'selected':''}>Điền từ</option></select>
  <button class="btn small danger" onclick="delQ(${pi},${qi})">Xoá</button></div>
  <textarea rows="2" placeholder="Nội dung câu hỏi (câu điền từ: dùng ______ cho chỗ trống)" oninput="qSet(${pi},${qi},'q',this.value)">${esc(q.q)}</textarea>
  ${q.type==='mcq'?`<textarea rows="4" placeholder="Mỗi dòng một lựa chọn, không cần gõ A, B, C" oninput="qOpts(${pi},${qi},this.value)">${esc((q.options||[]).join('\n'))}</textarea>
  <select onchange="qSet(${pi},${qi},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${'ABCDEF'.split('').map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`
  :q.type==='tfng'?`<select onchange="qSet(${pi},${qi},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${['TRUE','FALSE','NOT GIVEN'].map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`
  :`<input type="text" value="${esc(q.answer)}" placeholder="Đáp án. Nhiều đáp án chấp nhận thì cách nhau bằng dấu |, ví dụ: ten|10" oninput="qSet(${pi},${qi},'answer',this.value)">`}
  <textarea rows="2" placeholder="Giải thích đáp án (hiện sau khi nộp bài)" oninput="qSet(${pi},${qi},'explain',this.value)">${esc(q.explain)}</textarea></div>`).join('')}
  <button class="btn small" onclick="addQ(${pi})">Thêm câu hỏi</button></div>`).join('');
  app(`<h1>${DB.tests.some(t=>t.id===E.id)?'Sửa đề':'Thêm đề'} ${rd?'Reading':'Listening'}</h1><div class="form">
  <label>Tên đề</label><input type="text" value="${esc(E.title)}" oninput="eSet('title',this.value)" placeholder="Ví dụ: Cambridge 18 Test 1">
  <div class="two"><div><label>Thời gian làm cả đề (phút)</label><input type="text" value="${E.fullMinutes}" oninput="eSet('fullMinutes',+this.value||60)"></div>
  <div><label>Thời gian mini test mỗi part (phút)</label><input type="text" value="${E.partMinutes}" oninput="eSet('partMinutes',+this.value||20)"></div></div>
  ${parts}<div class="row"><button class="btn" onclick="addPart()">Thêm part</button><button class="btn primary" onclick="saveTest()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function saveTest(){
  if(!E.title.trim())return toast('Hãy nhập tên đề.');
  const t=JSON.parse(JSON.stringify(E));
  for(const p of t.parts){
    p.questions=p.questions.filter(q=>q.q.trim());
    p.questions.forEach(q=>{
      if(q.type==='mcq'){q.options=(q.options||[]).map(o=>o.trim().replace(/^[A-Fa-f][.)]\s+/,'')).filter(Boolean)}
      else delete q.options;
      q.answer=String(q.answer||'').trim();
    });
    for(const q of p.questions)if(!q.answer)return toast('Có câu hỏi chưa có đáp án đúng.');
  }
  if(!t.parts.some(p=>p.questions.length))return toast('Đề cần ít nhất 1 câu hỏi.');
  const i=DB.tests.findIndex(x=>x.id===t.id);
  if(i>=0)DB.tests[i]=t;else DB.tests.push(t);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}

/* ---- writing / speaking editors ---- */
let EW=null,ES=null;
function editWriting(id){
  const ex=DB.writing.find(x=>x.id===id);
  EW=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),task:2,title:'',prompt:'',imgKey:null,imgName:''};
  renderEW();
}
function renderEW(){
  app(`<h1>${DB.writing.some(x=>x.id===EW.id)?'Sửa':'Thêm'} đề Writing</h1><div class="form">
  <label>Loại</label><select onchange="EW.task=+this.value"><option value="1" ${EW.task===1?'selected':''}>Task 1 (20 phút)</option><option value="2" ${EW.task===2?'selected':''}>Task 2 (40 phút)</option></select>
  <label>Tên đề</label><input type="text" value="${esc(EW.title)}" oninput="EW.title=this.value">
  <label>Nội dung đề bài</label><textarea rows="10" oninput="EW.prompt=this.value">${esc(EW.prompt)}</textarea>
  <label>Hình ảnh biểu đồ (chỉ dùng cho Task 1, không bắt buộc)</label>
  ${EW.imgKey?`<div class="row"><span>${esc(EW.imgName||'ảnh')}</span><button class="btn small danger" onclick="rmWImg()">Xoá ảnh</button></div>`:`<input type="file" accept="image/*" onchange="upWImg(this)">`}
  <div class="row" style="margin-top:18px"><button class="btn primary" onclick="saveWriting()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
async function upWImg(inp){const f=inp.files[0];if(!f)return;await fdel(EW.imgKey);EW.imgKey='f_'+uid();EW.imgName=f.name;await fput(EW.imgKey,f);renderEW()}
async function rmWImg(){await fdel(EW.imgKey);EW.imgKey=null;EW.imgName='';renderEW()}
function saveWriting(){
  if(!EW.title.trim()||!EW.prompt.trim())return toast('Hãy nhập tên đề và nội dung đề bài.');
  const i=DB.writing.findIndex(x=>x.id===EW.id);if(i>=0)DB.writing[i]=EW;else DB.writing.push(EW);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}
function editSpeaking(id){
  const ex=DB.speaking.find(x=>x.id===id);
  ES=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),part:1,title:'',content:''};
  renderES();
}
function renderES(){
  app(`<h1>${DB.speaking.some(x=>x.id===ES.id)?'Sửa':'Thêm'} đề Speaking</h1><div class="form">
  <label>Part</label><select onchange="ES.part=+this.value">${[1,2,3].map(n=>`<option value="${n}" ${ES.part===n?'selected':''}>Part ${n}</option>`).join('')}</select>
  <label>Tên đề</label><input type="text" value="${esc(ES.title)}" oninput="ES.title=this.value">
  <label>Nội dung (Part 1 và Part 3: mỗi dòng một câu hỏi. Part 2: dán cả cue card)</label><textarea rows="10" oninput="ES.content=this.value">${esc(ES.content)}</textarea>
  <div class="row" style="margin-top:18px"><button class="btn primary" onclick="saveSpeaking()">Lưu đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function saveSpeaking(){
  if(!ES.title.trim()||!ES.content.trim())return toast('Hãy nhập tên đề và nội dung.');
  const i=DB.speaking.findIndex(x=>x.id===ES.id);if(i>=0)DB.speaking[i]=ES;else DB.speaking.push(ES);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}

/* ---- JSON import ---- */
function importJsonPage(){
  app(`<h1>Nhập đề từ JSON</h1><p class="lead">Dán JSON dạng <code>{"tests":[...],"writing":[...],"speaking":[...]}</code> hoặc một mảng đề Reading/Listening. Bạn có thể nhờ Claude soạn đề theo đúng định dạng này (chỉ nội dung chữ, file PDF và audio tải lên trong màn hình sửa đề).</p>
  <div class="form"><textarea id="jsonin" rows="16" placeholder='{"tests":[{"skill":"reading","title":"...","fullMinutes":60,"partMinutes":20,"parts":[{"title":"Part 1","text":"...","questions":[{"type":"mcq","q":"...","options":["...","..."],"answer":"B","explain":"..."}]}]}]}'></textarea>
  <div class="row" style="margin-top:14px"><button class="btn primary" onclick="doImportJson()">Nhập đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function doImportJson(){
  try{
    let d=JSON.parse($('#jsonin').value);if(Array.isArray(d))d={tests:d};
    let n=0;
    (d.tests||[]).forEach(t=>{
      if(!['reading','listening'].includes(t.skill)||!t.title||!Array.isArray(t.parts))throw new Error('Đề thiếu skill, title hoặc parts.');
      t.id=uid();t.fullMinutes=t.fullMinutes||60;t.partMinutes=t.partMinutes||(t.skill==='reading'?20:10);
      t.parts.forEach(p=>{p.text=p.text||'';p.tts=p.tts||'';p.pdfKey=null;p.audioKey=null;p.questions=(p.questions||[]).map(q=>({type:q.type||'mcq',q:q.q||'',options:q.options,answer:String(q.answer||''),explain:q.explain||''}))});
      DB.tests.push(t);n++;
    });
    (d.writing||[]).forEach(w=>{DB.writing.push({id:uid(),task:w.task===1?1:2,title:w.title||'Đề Writing',prompt:w.prompt||'',imgKey:null});n++});
    (d.speaking||[]).forEach(s=>{DB.speaking.push({id:uid(),part:[1,2,3].includes(s.part)?s.part:1,title:s.title||'Đề Speaking',content:s.content||''});n++});
    save();toast('Đã nhập '+n+' đề.');location.hash='#/manage';
  }catch(e){toast('JSON không hợp lệ: '+e.message)}
}

/* ============ backup ============ */
function backupPage(){
  app(`<h1>Sao lưu</h1><p class="lead">Toàn bộ dữ liệu (đề, bài làm, file PDF, audio, bản ghi âm) nằm trong trình duyệt này. Nếu xoá dữ liệu trình duyệt hoặc đổi máy, bạn sẽ mất hết. Hãy xuất bản sao lưu thường xuyên.</p>
  <div class="row"><button class="btn primary" onclick="exportAll()">Xuất bản sao lưu</button>
  <label class="btn">Nhập bản sao lưu<input type="file" accept="application/json" style="display:none" onchange="importAll(this)"></label>
  <button class="btn" onclick="restoreSamples()">Khôi phục đề mẫu</button></div>
  <p class="muted" style="margin-top:18px">Lưu ý: nhập bản sao lưu sẽ thay thế toàn bộ dữ liệu hiện tại.</p>`);
}
const toDataUrl=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
async function exportAll(){
  toast('Đang xuất dữ liệu...');
  const files={};for(const k of await fkeys()){const b=await fget(k);if(b)files[k]=await toDataUrl(b)}
  download('ielts-studio-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({db:DB,files})],{type:'application/json'}));
}
async function importAll(inp){
  const f=inp.files[0];if(!f)return;
  if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng bản sao lưu này?'))return;
  try{
    const d=JSON.parse(await f.text());if(!d.db||!d.db.tests)throw new Error('File không đúng định dạng.');
    for(const k of await fkeys())await fdel(k);
    for(const k in d.files||{}){const b=await (await fetch(d.files[k])).blob();await fput(k,b)}
    DB=d.db;['writing','speaking','attempts','essays','recs'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});if(!DB.drafts)DB.drafts={};
    save();toast('Đã nhập bản sao lưu.');location.hash='#/';
  }catch(e){toast('Không nhập được: '+e.message)}
}
function restoreSamples(){
  const s=samples();
  s.tests.forEach(t=>{if(!DB.tests.some(x=>x.id===t.id))DB.tests.push(t)});
  s.writing.forEach(t=>{if(!DB.writing.some(x=>x.id===t.id))DB.writing.push(t)});
  s.speaking.forEach(t=>{if(!DB.speaking.some(x=>x.id===t.id))DB.speaking.push(t)});
  save();toast('Đã thêm các đề mẫu còn thiếu.');
}

route();
</script>
